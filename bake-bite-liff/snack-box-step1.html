<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Snack Box · Bake & Bite</title><style>
:root{--brown:#5b2d1b;--green:#78966a;--cream:#fff8ee;--paper:#fffdf9;--line:#ead8c7;--muted:#7b6a60}
*{box-sizing:border-box}html,body{margin:0;background:#f6efe5;color:#402d27;font-family:system-ui,-apple-system,"Noto Sans Thai","Segoe UI",sans-serif}
body{min-height:100vh}.shell{width:min(100%,430px);min-height:100vh;margin:auto;background:linear-gradient(180deg,#fffdfa,#fff8ec);padding-bottom:120px;box-shadow:0 0 30px rgba(60,40,25,.08)}
.header{aspect-ratio:3/1;overflow:hidden;border-bottom:1px solid rgba(90,47,31,.08);background:#fff}.header img{width:100%;height:100%;display:block;object-fit:cover}
.title{text-align:center;padding:22px 18px 10px;position:relative}.title h1{font-size:40px;line-height:1;margin:0;color:var(--brown);font-weight:900}.title p{margin:9px 0 0;color:#6f5c51;font-size:15px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:10px 12px 4px}.step-pill{padding:9px 4px;border-radius:999px;background:#eee6dd;color:#8b786d;font-weight:900;text-align:center;font-size:11px}.step-pill.active{background:var(--brown);color:#fff}.step-pill.done{background:#e5eadf;color:#58704b}
.card{margin:12px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:0 5px 16px rgba(80,50,30,.05)}.card h2{margin:0 0 4px;font-size:24px;color:#4c3024}.sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(82px,1fr));gap:7px}.cat{border:1px solid #e7dbcf;border-radius:15px;background:#fff;padding:9px 5px;text-align:center;font-weight:800;font-size:11px;color:#4a3329;min-height:88px}.cat .ico{display:flex;width:44px;height:44px;margin:0 auto 5px;align-items:center;justify-content:center;font-size:28px}.cat .ico img{width:44px;height:44px;object-fit:contain;border-radius:10px}.cat.active{border:2px solid var(--brown);background:#fff8f2;color:var(--brown)}
.items{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{position:relative;border:1px solid #e5d7ca;background:#fff;border-radius:18px;padding:10px;min-height:148px}.item.selected{border:2px solid var(--brown);background:#fffaf5}.item .photo{height:82px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#fff7e9,#f2eee7);font-size:44px;overflow:hidden}.item .photo img{width:100%;height:100%;object-fit:cover;display:block}.item h3{margin:7px 0 3px;font-size:14px}.item p{margin:0 0 8px;font-size:11px;color:#7b6a60;min-height:30px}.check{display:none;position:absolute;right:8px;top:8px;width:23px;height:23px;border-radius:50%;background:var(--brown);color:#fff;place-items:center;font-weight:900}.item.selected .check{display:grid}
.qty{display:grid;grid-template-columns:34px 1fr 34px;gap:5px;align-items:center}.qty button{height:32px;border:0;border-radius:10px;font-size:18px;font-weight:900}.minus{background:#efe6dc;color:var(--brown)}.plus{background:var(--brown);color:#fff}.qty input{width:100%;height:32px;border:1px solid #e6d8ca;border-radius:10px;background:#fffdf9;text-align:center;font-weight:900;font-size:16px;color:#402d27;padding:0 3px;-moz-appearance:textfield}.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.footer-cta{position:sticky;bottom:92px;margin:12px;display:grid;grid-template-columns:1fr 1.6fr;gap:8px;z-index:10}.summary-pill,.nextbtn{border-radius:18px;padding:14px 10px;font-weight:900;border:0}.summary-pill{background:#f5ecdf;color:#51352a;text-align:center}.nextbtn{background:var(--brown);color:white;font-size:16px}
.qtybox{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}.qtybox button{height:48px;border:0;border-radius:14px;font-size:23px;font-weight:900}.qtybox input{height:48px;border:1px solid #d8c7ba;border-radius:14px;text-align:center;font-size:22px;font-weight:900;background:#fff}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.summary-item{border:1px solid #e5d7ca;border-radius:16px;padding:10px;background:#fff;text-align:center}.summary-item .photo{font-size:42px}.summary-item b{display:block;font-size:12px;margin-top:5px}
textarea{width:100%;min-height:88px;border:1px solid #decfc3;border-radius:14px;padding:12px;font:inherit;background:#fff}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:9px;margin:12px}.actions button,.actions a{border:0;border-radius:17px;padding:14px;font-weight:900;font-size:16px;text-align:center;text-decoration:none}.backbtn{background:#efe5db;color:var(--brown)}.confirm{background:var(--brown);color:#fff}
.nav{position:fixed;left:0;right:0;bottom:10px;z-index:30;pointer-events:none}
.navin{--notch-left:30%;width:min(calc(100% - 24px),398px);margin:auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:rgba(255,253,248,.985);border:1px solid rgba(90,47,31,.10);border-radius:24px;padding:12px 7px calc(10px + env(safe-area-inset-bottom));box-shadow:0 12px 28px rgba(75,52,35,.16);backdrop-filter:blur(10px);pointer-events:auto;overflow:visible;position:relative}
.navin:before{content:"";position:absolute;left:var(--notch-left);top:-1px;transform:translate(-50%,-1px);width:78px;height:38px;background:#fff8ec;border-radius:0 0 44px 44px;z-index:1;pointer-events:none;box-shadow:0 1px 0 #fff8ec}
.nav a{position:relative;z-index:2;min-height:54px;text-decoration:none;color:#6b4a3a;text-align:center;font-size:11.5px;font-weight:700;line-height:1.15;padding:5px 2px 2px;overflow:visible}
.nav a b{display:flex;width:40px;height:40px;align-items:center;justify-content:center;margin:0 auto 3px;border-radius:50%;font-size:21px;line-height:1;background:transparent;border:0}
.nav a b .snack-nav-svg{display:block!important;width:30px!important;height:24px!important;opacity:1!important;visibility:visible!important;stroke:#6b4a3a!important}
.nav a b .snack-nav-svg path{stroke:#6b4a3a!important}
.nav a.active{color:#4a281b;font-weight:900}
.nav a.active b{width:56px;height:56px;margin-top:-29px;margin-bottom:5px;background:#5b2d1b;border:4px solid #fff8ef;box-shadow:0 8px 20px rgba(74,40,27,.28);font-size:25px;color:#fff;transform:translateY(-1px)}
.nav a.active b .snack-nav-svg,.nav a.active b .snack-nav-svg path{stroke:#fff!important}
.nav a span{display:block;margin-top:0}
@media(max-width:380px){.navin{width:calc(100% - 18px);padding-left:4px;padding-right:4px}.navin:before{width:72px;height:35px}.nav a{font-size:10.5px}.nav a b{width:37px;height:37px;font-size:19px}.nav a.active b{width:52px;height:52px;font-size:23px;margin-top:-26px}}
</style></head><body><div class="shell"><header class="header"><img src="bake-bite-header-v2.png?v=20260927-0810" alt="Bake & Bite"></header><div class="title"><h1>Snack Box</h1><p>Step 1 เลือกหมวดอาหาร และเลือกเมนูที่ต้องการ</p></div><div class="steps">
  <div class="step-pill active">1 อาหาร</div>
  <div class="step-pill ">2 ของหวาน</div>
  <div class="step-pill ">3 เครื่องดื่ม</div>
  <div class="step-pill ">4 สรุป</div>
  </div><section class="card"><h2>เลือกหมวดอาหาร</h2><div class="sub">เลือกหมวดที่ต้องการ</div><div id="categoryLoading" class="sub">กำลังโหลดหมวดอาหาร...</div><div id="categories" class="categories"></div></section>
  <section class="card"><h2>รายการอาหาร</h2><div class="sub">เลือกได้หลายเมนู และกำหนดจำนวนแยกแต่ละเมนู</div><div id="items" class="items"></div></section>
  <div class="footer-cta"><div class="summary-pill" id="picked">เลือกแล้ว 0 รายการ</div><button class="nextbtn" id="next" disabled>ถัดไป: เลือกของหวาน ›</button></div></div><nav class="nav"><div class="navin">
<a href="index.html#order"><b>🛒</b><span>สั่งอาหาร</span></a>
<a class="active" href="snack-box-step1.html?preview=1&v=20260927-1925"><b><svg class="snack-nav-svg" viewBox="0 0 32 24" width="30" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5h18v13h-18z"/><path d="M2.5 7.5 11.5 3l9 4.5"/><path d="M6 16l5.2-5.2L16.5 16H6z"/><path d="M7.5 13.8h7.4"/><path d="M24 6h4.5v14H24z"/><path d="M25 2.5h2.5V6H25z"/><path d="M24 10h4.5"/></svg></b><span>Snack Box</span></a>
<a href="index.html#points"><b>☆</b><span>สะสมแต้ม</span></a>
<a href="index.html#redeem"><b>🎁</b><span>แลกแต้ม</span></a>
<a href="index.html#contact"><b>💬</b><span>ติดต่อร้าน</span></a>
</div></nav><script>
const TEST_PREVIEW=new URLSearchParams(location.search).get('preview')==='1';
function snackTestUrl(url){
  if(!TEST_PREVIEW) return url;
  const parts=url.split('#');
  const p=parts[0], hash=parts[1]?'#'+parts[1]:'';
  return p+(p.includes('?')?'&':'?')+'preview=1'+hash;
}
if(TEST_PREVIEW){
  document.querySelectorAll('a[href]').forEach(a=>{
    const h=a.getAttribute('href')||'';
    if(h && !/^https?:/i.test(h) && !h.startsWith('#')) a.setAttribute('href',snackTestUrl(h));
  });
}
function snackGo(url){ location.href=snackTestUrl(url); }

const STORE_API="https://oplwrlljqwgxnrqrdufp.supabase.co/functions/v1/store-api";
let catalog={categories:[],products:[]};
let foodCategories=[];
let currentCategoryId="";
const selections=new Map();

const categoryRoot=document.getElementById('categories');
const categoryLoading=document.getElementById('categoryLoading');
const items=document.getElementById('items');
const picked=document.getElementById('picked');
const next=document.getElementById('next');

function esc(v){
  return String(v??'').replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
}
function safeUrl(v){
  const s=String(v||'');
  if(/^https:\/\//i.test(s)) return s;
  if(/^data:image\/(?:png|jpe?g|webp|gif);base64,/i.test(s)) return s;
  return '';
}
function categoryFallback(name){
  if(/สลัด|salad|roll/i.test(name)) return '🥗';
  if(/แซนด์วิช|sandwich/i.test(name)) return '🥪';
  if(/เบเกอรี่|bakery|bread/i.test(name)) return '🥐';
  return '🍴';
}
function productFallback(name){
  if(/สลัด|roll/i.test(name)) return '🥗';
  if(/แซนด์วิช|sandwich/i.test(name)) return '🥪';
  if(/ครัวซอง|croissant|เบเกอรี่|bread/i.test(name)) return '🥐';
  return '🍴';
}
function isFoodCategory(c){
  const n=String(c.name||'');
  return !/เครื่องดื่ม|drink|แยม|ของหวาน|dessert|sweet/i.test(n);
}
function restoreSelections(){
  let old=[];
  try{old=JSON.parse(sessionStorage.getItem('snackFood')||'[]')}catch(_){}
  if(!Array.isArray(old) && old && old.name) old=[old];
  (old||[]).forEach(x=>{if(x&&x.id&&Number(x.qty)>0)selections.set(String(x.id),{...x,qty:Number(x.qty)})});
}
function renderCategories(){
  categoryRoot.innerHTML=foodCategories.map(c=>{
    const icon=safeUrl(c.icon_url)
      ? '<span class="ico"><img src="'+esc(c.icon_url)+'" alt=""></span>'
      : '<span class="ico">'+categoryFallback(c.name)+'</span>';
    return '<button type="button" class="cat '+(String(c.id)===String(currentCategoryId)?'active':'')+'" data-id="'+esc(c.id)+'">'+icon+'<span>'+esc(c.name)+'</span></button>';
  }).join('');
  categoryLoading.style.display=foodCategories.length?'none':'block';
  if(!foodCategories.length)categoryLoading.textContent='ยังไม่มีหมวดอาหารในหลังร้าน';
}
function productsForCurrentCategory(){
  return catalog.products.filter(p=>String(p.category_id)===String(currentCategoryId));
}
function renderItems(){
  const ps=productsForCurrentCategory();
  if(!ps.length){
    items.innerHTML='<div class="sub" style="grid-column:1/-1;padding:10px 2px">ยังไม่มีสินค้าในหมวดนี้</div>';
    return;
  }
  items.innerHTML=ps.map(p=>{
    const sel=selections.get(String(p.id));
    const q=Number(sel?.qty||0);
    const image=safeUrl(p.image_url)?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'">':productFallback(p.name);
    return '<div class="item '+(q>0?'selected':'')+'" data-id="'+esc(p.id)+'">'+
      '<span class="check">✓</span><div class="photo">'+image+'</div>'+
      '<h3>'+esc(p.name)+'</h3>'+
      '<p>'+esc(catalog.categories.find(c=>String(c.id)===String(p.category_id))?.name||'')+'</p>'+
      '<div class="qty"><button type="button" class="minus" data-d="-1">−</button>'+
      '<input class="qty-input" type="number" inputmode="numeric" min="0" max="999" value="'+q+'" aria-label="จำนวน '+esc(p.name)+'">'+
      '<button type="button" class="plus" data-d="1">+</button></div></div>';
  }).join('');
}
function setProductQty(p,n){
  n=Math.max(0,Math.min(999,Math.floor(Number(n)||0)));
  if(n===0) selections.delete(String(p.id));
  else selections.set(String(p.id),{
    id:p.id,category_id:p.category_id,name:p.name,image_url:p.image_url||'',
    icon:productFallback(p.name),qty:n
  });
  return n;
}
function totals(){
  const arr=[...selections.values()].filter(x=>Number(x.qty)>0);
  return {arr,total:arr.reduce((s,x)=>s+Number(x.qty||0),0),menus:arr.length};
}
function update(){
  const t=totals();
  picked.textContent='รวม '+t.total+' ชิ้น • '+t.menus+' เมนู';
  next.disabled=t.total<=0;
}
categoryRoot.addEventListener('click',e=>{
  const b=e.target.closest('.cat');if(!b)return;
  currentCategoryId=b.dataset.id;
  renderCategories();renderItems();update();
});
items.addEventListener('click',e=>{
  if(e.target.classList.contains('qty-input'))return;
  const item=e.target.closest('.item');if(!item)return;
  const p=catalog.products.find(x=>String(x.id)===String(item.dataset.id));if(!p)return;
  const old=Number(selections.get(String(p.id))?.qty||0);
  const d=Number(e.target.dataset.d||0);
  setProductQty(p,d?old+d:(old||1));
  renderItems();update();
});
items.addEventListener('input',e=>{
  const input=e.target.closest('.qty-input');if(!input)return;
  const item=input.closest('.item');
  const p=catalog.products.find(x=>String(x.id)===String(item.dataset.id));if(!p)return;
  const n=setProductQty(p,input.value);
  item.classList.toggle('selected',n>0);
  update();
});
items.addEventListener('change',e=>{
  const input=e.target.closest('.qty-input');if(!input)return;
  const item=input.closest('.item');
  const p=catalog.products.find(x=>String(x.id)===String(item.dataset.id));if(!p)return;
  input.value=String(setProductQty(p,input.value));
  update();
});
next.onclick=()=>{
  const t=totals();if(t.total<=0)return;
  sessionStorage.setItem('snackFood',JSON.stringify(t.arr));
  sessionStorage.setItem('snackBoxTarget',String(t.total));
  sessionStorage.setItem('snackQty',String(t.total));
  for(const key of ['snackDessert','snackDrink']){
    try{
      const a=JSON.parse(sessionStorage.getItem(key)||'[]');
      const arr=Array.isArray(a)?a:(a&&a.name?[a]:[]);
      const sum=arr.reduce((s,x)=>s+Number(x.qty||0),0);
      if(sum!==t.total)sessionStorage.removeItem(key);
    }catch(_){sessionStorage.removeItem(key)}
  }
  snackGo('snack-box-step2.html');
};
async function loadCatalog(){
  try{
    const r=await fetch(STORE_API+'?action=catalog');
    const j=await r.json();
    if(!r.ok||!j.ok)throw new Error(j.error||'catalog');
    catalog=j;
    foodCategories=(j.categories||[]).filter(isFoodCategory);
    currentCategoryId=foodCategories[0]?.id||'';
    restoreSelections();
    renderCategories();renderItems();update();
  }catch(error){
    console.error(error);
    categoryLoading.style.display='block';
    categoryLoading.textContent='โหลดหมวดอาหารไม่สำเร็จ กรุณาลองใหม่';
    items.innerHTML='<div class="sub" style="grid-column:1/-1">ยังโหลดรายการอาหารไม่ได้</div>';
  }
}
loadCatalog();
</script></body></html>
