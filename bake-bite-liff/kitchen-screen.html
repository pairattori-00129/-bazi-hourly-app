<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kitchen Screen · Bake & Bite</title>
<style>
:root{
  font-family:system-ui,-apple-system,"Noto Sans Thai","Segoe UI",sans-serif;
  --bg:#171b1d;--panel:#202629;--paper:#fffdf9;--ink:#2f241f;--muted:#786960;
  --brown:#6b2f1b;--red:#9d2e22;--amber:#b17a05;--green:#237334;--line:#eaded2;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#fff;min-height:100%}
body{visibility:hidden}
body.admin-verified{visibility:visible}
button,select{font:inherit}
.topbar{
  position:sticky;top:0;z-index:20;background:#fffaf2;color:#43281d;
  display:grid;grid-template-columns:minmax(280px,1.2fr) repeat(4,minmax(110px,.55fr)) minmax(180px,.7fr);
  align-items:stretch;border-bottom:1px solid #d8cabd;box-shadow:0 6px 18px rgba(0,0,0,.18)
}
.brand{display:flex;align-items:center;gap:14px;padding:12px 18px}
.logoMark{width:56px;height:56px;border-radius:16px;background:linear-gradient(145deg,#fff3df,#f4dfc2);display:grid;place-items:center;font-size:32px}
.brand h1{font-size:29px;margin:0;color:#5b2d1b;line-height:1}
.brand p{margin:4px 0 0;color:#857064;font-size:13px}
.metric{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 10px;border-left:1px solid #e8ded4}
.metric .ico{font-size:27px}.metric small{display:block;font-weight:800;opacity:.8}.metric strong{font-size:28px;line-height:1}
.metric.total{background:#242627;color:#fff}.metric.wait{background:#8c271e;color:#fff}.metric.work{background:#80620d;color:#fff}.metric.ready{background:#1f682e;color:#fff}
.clock{display:grid;place-items:center;padding:8px 14px;background:#222526;color:#fff;text-align:center}
.clock small{font-weight:800}.clock strong{font-size:28px;letter-spacing:.03em}

.toolbar{position:sticky;top:81px;z-index:18;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#202527;border-bottom:1px solid #383f42;overflow:auto}
.filter{border:1px solid #536065;background:#2c3336;color:#fff;border-radius:12px;padding:10px 16px;font-weight:800;white-space:nowrap}
.filter.active{background:#f6cf6a;color:#3a2a12;border-color:#f6cf6a}
.toolbar .spacer{flex:1}
.toolbar select,.ghost{border:1px solid #536065;background:#2c3336;color:#fff;border-radius:12px;padding:10px 14px;font-weight:800}
.ghost{cursor:pointer}

.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px;min-height:calc(100vh - 145px)}
.lane{border-radius:16px;padding:0 8px 10px;min-width:0}
.lane.wait{background:linear-gradient(180deg,#4a241e,#2a2020)}
.lane.work{background:linear-gradient(180deg,#4a3d17,#2a261c)}
.lane.ready{background:linear-gradient(180deg,#183c22,#1c2820)}
.laneHead{position:sticky;top:137px;z-index:5;margin:0 -8px 8px;padding:10px 14px;border-radius:16px 16px 10px 10px;display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:24px}
.wait .laneHead{background:#9b3527}.work .laneHead{background:#9a7412}.ready .laneHead{background:#237539}
.count{min-width:38px;height:38px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.18);display:grid;place-items:center}

.ticket{background:var(--paper);color:var(--ink);border-radius:14px;margin:8px 0;padding:12px;box-shadow:0 5px 14px rgba(0,0,0,.18);overflow:hidden}
.ticket.snack{border:2px solid #d76058}
.ticketTop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.orderNo{font-size:24px;font-weight:950;letter-spacing:.01em}
.time{font-size:13px;color:#695d56;font-weight:800}
.age{margin-left:auto;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900;background:#e9f1e5;color:#326829}
.age.warn{background:#fff0c7;color:#9a6800}.age.late{background:#ffe0dc;color:#c2332a}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:#edf2e8;color:#416435}
.badge.delivery{background:#fde8e7;color:#b13d34}.badge.snack{background:#ffe6e4;color:#b72f29}
.items{margin-top:9px;border-top:1px solid #eee2d7}
.line{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid #f1e7dd;align-items:center}
.line .name{font-size:15px;font-weight:800}.line .qty{font-size:18px;font-weight:950}
.note{margin-top:8px;padding:8px 10px;border-radius:10px;background:#f7eee5;font-size:13px}
.note strong{color:#a63d31}
.actions{display:grid;grid-template-columns:1fr;gap:7px;margin-top:10px}
.action{border:0;border-radius:11px;padding:11px;font-size:16px;font-weight:950;color:#fff;cursor:pointer}
.wait .action{background:#7c341f}.work .action{background:#b58108}.ready .action{background:#28743a}
.action:disabled{opacity:.5}
.empty{padding:28px 14px;text-align:center;color:#d2c6bd}
.footerMsg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;background:#fff;color:#422b20;border-radius:999px;padding:9px 15px;box-shadow:0 8px 25px rgba(0,0,0,.25);font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}
.footerMsg.show{opacity:1}

@media(max-width:980px){
  .topbar{grid-template-columns:1fr repeat(3,110px);}.metric.total,.clock{display:none}
  .board{grid-template-columns:1fr;}.toolbar{top:80px}.laneHead{position:static}
}
@media(max-width:640px){
  .brand h1{font-size:22px}.brand{padding:10px}.logoMark{width:44px;height:44px}
  .topbar{grid-template-columns:1fr repeat(3,84px)}.metric{gap:4px;padding:6px}.metric small{font-size:10px}.metric strong{font-size:20px}.metric .ico{display:none}
  .toolbar{top:64px;padding:8px}.filter{padding:9px 11px}.board{padding:8px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logoMark">🥪</div>
    <div><h1>หน้าจอครัว</h1><p>BAKE & BITE · Kitchen Screen</p></div>
  </div>
  <div class="metric total"><span class="ico">📋</span><div><small>ออเดอร์ทั้งหมด</small><strong id="totalCount">0</strong></div></div>
  <div class="metric wait"><span class="ico">🕒</span><div><small>รอทำ</small><strong id="waitCount">0</strong></div></div>
  <div class="metric work"><span class="ico">👨‍🍳</span><div><small>กำลังทำ</small><strong id="workCount">0</strong></div></div>
  <div class="metric ready"><span class="ico">✅</span><div><small>พร้อมรับ</small><strong id="readyCount">0</strong></div></div>
  <div class="clock"><small id="dateText"></small><strong id="clockText">--:--:--</strong></div>
</header>

<div class="toolbar">
  <button class="filter active" data-filter="all">▦ ทั้งหมด</button>
  <button class="filter" data-filter="food">🍴 อาหาร</button>
  <button class="filter" data-filter="dessert">🍰 ของหวาน</button>
  <button class="filter" data-filter="drink">🥤 เครื่องดื่ม</button>
  <div class="spacer"></div>
  <select id="sortSelect" aria-label="การเรียงออเดอร์">
    <option value="oldest">เรียงตามเวลา เก่าก่อน</option>
    <option value="newest">ใหม่ก่อน</option>
  </select>
  <button class="ghost" id="refreshButton">↻ โหลดล่าสุด</button>
  <button class="ghost" id="fullscreenButton">⛶ เต็มจอ</button>
  <a class="ghost" href="admin-main.html" style="text-decoration:none">⚙ Admin</a>
</div>

<main class="board">
  <section class="lane wait">
    <div class="laneHead"><span>🕒 รอทำ</span><span class="count" id="laneWaitCount">0</span></div>
    <div id="waitLane"></div>
  </section>
  <section class="lane work">
    <div class="laneHead"><span>👨‍🍳 กำลังทำ</span><span class="count" id="laneWorkCount">0</span></div>
    <div id="workLane"></div>
  </section>
  <section class="lane ready">
    <div class="laneHead"><span>✅ พร้อมรับ</span><span class="count" id="laneReadyCount">0</span></div>
    <div id="readyLane"></div>
  </section>
</main>
<div class="footerMsg" id="toast"></div>

<script src="admin-session.js"></script>
<script>
let orders=[];
let activeFilter='all';
let lastSignature='';
const FOOD_WORDS=/สลัด|โรล|แซนด์วิช|sandwich|salad|ขนมปัง|ไส้กรอก|โบโลน่า|แฮม|ทูน่า|ไข่/i;
const DESSERT_WORDS=/แยม|เบเกอรี่|ครัวซอง|เค้ก|คุกกี้|บราวนี่|ของหวาน|dessert|sweet|bakery/i;
const DRINK_WORDS=/น้ำ|ชา|กาแฟ|drink|coffee|tea|เก๊กฮวย|รากบัว/i;

function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showToast(text){
  const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');
  clearTimeout(showToast._timer);showToast._timer=setTimeout(()=>t.classList.remove('show'),1800);
}
function currentClock(){
  const d=new Date();
  clockText.textContent=d.toLocaleTimeString('th-TH',{hour12:false});
  dateText.textContent=d.toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}
setInterval(currentClock,1000);currentClock();

function ageMinutes(o){
  const t=new Date(o.created_at).getTime();
  return Math.max(0,Math.floor((Date.now()-t)/60000));
}
function ageClass(m){return m>=20?'late':m>=10?'warn':''}
function isSnack(o){
  return /^SB/i.test(String(o.order_no||'')) || /snack\s*box/i.test(String(o.note||''));
}
function matchesFilter(o){
  if(activeFilter==='all')return true;
  const names=(o.order_items||[]).map(i=>i.product_name||'').join(' ');
  if(activeFilter==='food')return FOOD_WORDS.test(names);
  if(activeFilter==='dessert')return DESSERT_WORDS.test(names);
  if(activeFilter==='drink')return DRINK_WORDS.test(names);
  return true;
}
function statusGroup(o){
  if(o.status==='preparing')return 'work';
  if(o.status==='ready')return 'ready';
  if(['pending','confirmed'].includes(o.status))return 'wait';
  return 'hidden';
}
function nextAction(o){
  if(['pending','confirmed'].includes(o.status))return {status:'preparing',label:'▶ เริ่มทำ'};
  if(o.status==='preparing')return {status:'ready',label:'✓ พร้อมรับ'};
  if(o.status==='ready')return {status:'completed',label:'✓ เสร็จสิ้น'};
  return null;
}
function itemMatches(name){
  if(activeFilter==='all')return true;
  if(activeFilter==='food')return FOOD_WORDS.test(name);
  if(activeFilter==='dessert')return DESSERT_WORDS.test(name);
  if(activeFilter==='drink')return DRINK_WORDS.test(name);
  return true;
}
function ticketHtml(o){
  const mins=ageMinutes(o);
  const snack=isSnack(o);
  const items=(o.order_items||[]).filter(i=>itemMatches(String(i.product_name||'')));
  const action=nextAction(o);
  const fulfillment=o.fulfillment_method==='lineman'?'เดลิเวอรี่':'รับที่ร้าน';
  const fulfillmentClass=o.fulfillment_method==='lineman'?'delivery':'';
  const created=new Date(o.created_at).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false});
  const note=o.note||o.delivery_note||'';
  return '<article class="ticket '+(snack?'snack':'')+'" data-order="'+safe(o.id)+'">'+
    '<div class="ticketTop"><span class="orderNo">'+safe(o.order_no||o.id)+'</span><span class="time">🕒 '+safe(created)+'</span><span class="age '+ageClass(mins)+'">⏱ '+mins+' นาที</span></div>'+
    '<div class="badges"><span class="badge '+fulfillmentClass+'">'+(fulfillmentClass?'🛵 ':'🏪 ')+fulfillment+'</span>'+(snack?'<span class="badge snack">🎁 Snack Box</span>':'')+'</div>'+
    '<div class="items">'+(items.length?items.map(i=>'<div class="line"><span class="name">'+safe(i.product_name)+'</span><span class="qty">× '+Number(i.quantity||0)+'</span></div>').join(''):'<div class="line"><span class="name">ไม่มีรายการในตัวกรองนี้</span><span></span></div>')+'</div>'+
    (note?'<div class="note">📝 หมายเหตุ: <strong>'+safe(note)+'</strong></div>':'')+
    (action?'<div class="actions"><button class="action" data-next="'+action.status+'">'+action.label+'</button></div>':'')+
  '</article>';
}
function sorted(list){
  return [...list].sort((a,b)=>sortSelect.value==='newest'?new Date(b.created_at)-new Date(a.created_at):new Date(a.created_at)-new Date(b.created_at));
}
function render(){
  const visible=orders.filter(o=>statusGroup(o)!=='hidden'&&matchesFilter(o));
  const wait=sorted(visible.filter(o=>statusGroup(o)==='wait'));
  const work=sorted(visible.filter(o=>statusGroup(o)==='work'));
  const ready=sorted(visible.filter(o=>statusGroup(o)==='ready'));
  waitLane.innerHTML=wait.length?wait.map(ticketHtml).join(''):'<div class="empty">ไม่มีออเดอร์รอทำ</div>';
  workLane.innerHTML=work.length?work.map(ticketHtml).join(''):'<div class="empty">ยังไม่มีออเดอร์กำลังทำ</div>';
  readyLane.innerHTML=ready.length?ready.map(ticketHtml).join(''):'<div class="empty">ยังไม่มีออเดอร์พร้อมรับ</div>';
  totalCount.textContent=visible.length;waitCount.textContent=wait.length;workCount.textContent=work.length;readyCount.textContent=ready.length;
  laneWaitCount.textContent=wait.length;laneWorkCount.textContent=work.length;laneReadyCount.textContent=ready.length;
}
async function loadOrders(silent=false){
  try{
    const result=await adminRequest('admin-orders');
    const incoming=result.orders||[];
    const sig=incoming.map(o=>o.id+':'+o.status+':'+o.updated_at).join('|');
    const changed=lastSignature && sig!==lastSignature;
    orders=incoming;lastSignature=sig;render();
    if(!silent)showToast('โหลดออเดอร์ล่าสุดแล้ว');
    if(changed&&silent)showToast('มีการอัปเดตออเดอร์');
  }catch(e){if(!silent)showToast('โหลดออเดอร์ไม่สำเร็จ')}
}
async function updateOrder(id,status,button){
  button.disabled=true;
  try{
    const current=orders.find(o=>String(o.id)===String(id));
    await adminRequest('admin-update-order','POST',{id,status,payment_status:current?.payment_status||'pending'});
    await loadOrders(true);
    showToast(status==='preparing'?'ย้ายไปกำลังทำแล้ว':status==='ready'?'ย้ายไปพร้อมรับแล้ว':'ปิดออเดอร์แล้ว');
  }catch(e){showToast('อัปเดตสถานะไม่สำเร็จ')}
  finally{button.disabled=false}
}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');activeFilter=b.dataset.filter;render();
});
sortSelect.onchange=render;
refreshButton.onclick=()=>loadOrders(false);
fullscreenButton.onclick=async()=>{
  try{
    if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){showToast('อุปกรณ์นี้ไม่รองรับเต็มจอ')}
};
document.querySelector('.board').onclick=e=>{
  const b=e.target.closest('button[data-next]');if(!b)return;
  const card=b.closest('[data-order]');updateOrder(card.dataset.order,b.dataset.next,b);
};

requireAdmin().then(async ok=>{
  if(!ok)return;
  await loadOrders(false);
  setInterval(()=>loadOrders(true),10000);
  setInterval(render,30000);
});
</script>
</body>
</html>
