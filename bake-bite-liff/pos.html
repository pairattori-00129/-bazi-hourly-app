<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bake & Bite POS</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;color:#3f2b21;background:#f5eee7}
*{box-sizing:border-box}body{margin:0;visibility:hidden}body.pos-verified{visibility:visible}
.brand-header{height:110px;background:#fff;overflow:hidden;border-bottom:1px solid #ead8c7}.brand-header img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
header{height:70px;background:#fff;border-bottom:1px solid #e5d6c7;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5;box-shadow:0 3px 12px rgba(80,50,30,.06)}
header h1{margin:0;color:#5b2d1b;font-size:25px}.top-actions{display:flex;gap:10px;align-items:center}.smallbtn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.rolebadge{padding:8px 12px;border-radius:999px;background:#fff3dd;font-weight:900;font-size:13px}
.layout{display:grid;grid-template-columns:180px minmax(0,1fr) 380px;height:calc(100vh - 180px)}
.categories{background:#fff;border-right:1px solid #e5d6c7;padding:14px;overflow:auto}.cat{width:100%;border:0;border-radius:14px;padding:13px 10px;margin-bottom:9px;background:#f3e9df;font-weight:800;text-align:left;cursor:pointer}.cat.active{background:#5b2d1b;color:#fff}
.products{padding:16px;overflow:auto}.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.product{background:#fff;border:1px solid #e7d8c9;border-radius:18px;padding:12px;cursor:pointer;box-shadow:0 5px 16px #4f31130c}.product img{width:100%;aspect-ratio:1.25/1;object-fit:cover;border-radius:13px;background:#eee}.product h3{font-size:17px;margin:10px 0 5px}.price{font-size:20px;font-weight:900;color:#a8522e}
.cart{background:#fff;border-left:1px solid #e5d6c7;padding:16px;display:flex;flex-direction:column;min-width:0}.cart h2{margin:0 0 12px}.cart-list{flex:1;overflow:auto;border-top:1px solid #eee;border-bottom:1px solid #eee}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid #f0e7df}.qty{display:flex;align-items:center;gap:7px}.qty button{width:30px;height:30px;border:0;border-radius:9px;font-weight:900;cursor:pointer}
.summary{padding-top:12px}.total{display:flex;justify-content:space-between;font-size:28px;font-weight:900;margin:6px 0 12px}.field{width:100%;padding:12px;border:1px solid #dac8b8;border-radius:12px;font:inherit;margin-bottom:9px}
.paymethods{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:8px 0 10px}.paymethods label{border:2px solid #e0d1c3;border-radius:13px;padding:11px;text-align:center;font-weight:800;cursor:pointer}.paymethods input{margin-right:5px}
.primary{width:100%;border:0;border-radius:14px;background:#659348;color:#fff;font-size:18px;font-weight:900;padding:14px;cursor:pointer}.primary:disabled{opacity:.45}.secondary{width:100%;border:0;border-radius:14px;background:#8f8178;color:#fff;font-weight:800;padding:11px;margin-top:8px;cursor:pointer}
.status{margin:9px 0;padding:10px;border-radius:12px;background:#fff8ef;font-weight:800;min-height:42px}.voice-on{background:#e9f6e7;color:#365d2d}.voice-off{background:#f3e9df;color:#715d51}
@media(max-width:980px){.brand-header{height:90px}.layout{grid-template-columns:150px 1fr 330px;height:calc(100vh - 160px)}.product-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}}
</style></head>
<body><div class="brand-header"><img src="bake-bite-header-v2.png?v=20261007-1035" alt="Bake & Bite"></div><header><div><div style="font-size:12px;font-weight:900;color:#8a694f">BAKE & BITE · POINT OF SALE</div><h1>POS หน้าร้าน</h1></div><div class="top-actions"><span id="roleBadge" class="rolebadge">USER</span><button id="voiceBtn" class="smallbtn voice-off" onclick="enableVoice()">🔇 เปิดเสียงประกาศ</button><button class="smallbtn" onclick="goAdmin()">Admin</button><button class="smallbtn" onclick="logoutPos()">ออกจากระบบ</button></div></header>
<div class="layout"><aside class="categories" id="categories"></aside><main class="products"><div class="product-grid" id="products"></div></main><aside class="cart">
<h2>ออเดอร์หน้าร้าน</h2><input id="customerName" class="field" placeholder="ชื่อลูกค้า (ไม่บังคับ)">
<div id="cartList" class="cart-list"></div>
<div class="summary"><div class="total"><span>รวม</span><span id="total">฿0</span></div>
<div class="paymethods"><label><input type="radio" name="pay" value="cash" checked>เงินสด</label><label><input type="radio" name="pay" value="promptpay">PromptPay / QR</label></div>
<div id="status" class="status">พร้อมรับออเดอร์</div>
<button id="createBtn" class="primary" onclick="createOrder()">สร้างออเดอร์</button>
<button class="secondary" onclick="clearCart()">ล้างรายการ</button></div></aside></div>
<script src="pos-session.js"></script>
<script>
const STORE_API='https://oplwrlljqwgxnrqrdufp.supabase.co/functions/v1/store-api';
let catalog={categories:[],products:[]},cart={},activeCategory=null,currentOrder=null,voiceEnabled=false,lastFeedTime=new Date().toISOString(),announced=new Set();
const money=n=>'฿'+Number(n||0).toLocaleString('th-TH');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function boot(){if(!await requirePos())return;document.getElementById('roleBadge').textContent=posRole().toUpperCase();await loadCatalog();renderAll();setInterval(checkPaidFeed,4000)}
async function loadCatalog(){const r=await fetch(STORE_API+'?action=catalog');const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'โหลดเมนูไม่สำเร็จ');catalog=j;activeCategory=catalog.categories[0]?.id||null}
function renderAll(){renderCats();renderProducts();renderCart()}
function renderCats(){document.getElementById('categories').innerHTML=catalog.categories.map(c=>'<button class="cat '+(c.id===activeCategory?'active':'')+'" onclick="activeCategory=\''+c.id+'\';renderAll()">'+esc(c.name)+'</button>').join('')}
function renderProducts(){const list=catalog.products.filter(p=>!activeCategory||p.category_id===activeCategory);document.getElementById('products').innerHTML=list.map(p=>'<div class="product" onclick="addItem(\''+p.id+'\')">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="">':'<div style="aspect-ratio:1.25/1;border-radius:13px;background:#f1e9e2;display:grid;place-items:center;font-size:42px">🥪</div>')+'<h3>'+esc(p.name)+'</h3><div class="price">'+money(p.price)+'</div></div>').join('')}
function addItem(id){cart[id]=(cart[id]||0)+1;renderCart()}
function changeQty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];renderCart()}
function clearCart(){cart={};currentOrder=null;document.getElementById('status').textContent='พร้อมรับออเดอร์';document.getElementById('createBtn').textContent='สร้างออเดอร์';document.getElementById('createBtn').onclick=createOrder;renderCart()}
function cartItems(){return Object.entries(cart).map(([id,q])=>{const p=catalog.products.find(x=>x.id===id);return p?{...p,quantity:q}:null}).filter(Boolean)}
function renderCart(){const items=cartItems();document.getElementById('cartList').innerHTML=items.length?items.map(i=>'<div class="row"><div><strong>'+esc(i.name)+'</strong><div>'+money(i.price)+' × '+i.quantity+'</div></div><div class="qty"><button onclick="changeQty(\''+i.id+'\',-1)">−</button><strong>'+i.quantity+'</strong><button onclick="changeQty(\''+i.id+'\',1)">+</button></div></div>').join(''):'<div style="padding:24px;text-align:center;color:#8a796d">แตะสินค้าเพื่อเพิ่มรายการ</div>';const total=items.reduce((s,i)=>s+Number(i.price)*i.quantity,0);document.getElementById('total').textContent=money(total);document.getElementById('createBtn').disabled=!items.length&&!currentOrder}
async function createOrder(){const items=cartItems();if(!items.length)return;const pay=document.querySelector('input[name="pay"]:checked').value;const btn=document.getElementById('createBtn');btn.disabled=true;try{const r=await posRequest('order','POST',{items:items.map(i=>({product_id:i.id,quantity:i.quantity})),payment_method:pay,customer_name:document.getElementById('customerName').value.trim()});currentOrder=r.order;document.getElementById('status').innerHTML='ออเดอร์ <b>'+esc(r.order.order_no)+'</b> · '+money(r.order.total)+'<br>'+ (pay==='cash'?'รับเงินสดแล้วกดปุ่มยืนยัน':'แสดง QR ให้ลูกค้าสแกน แล้วกดยืนยันหลังตรวจยอด');document.getElementById('createBtn').textContent='ยืนยันรับชำระ '+money(r.order.total);document.getElementById('createBtn').onclick=confirmPaid;btn.disabled=false}catch(e){alert(e.message);btn.disabled=false}}
async function confirmPaid(){if(!currentOrder)return;const btn=document.getElementById('createBtn');btn.disabled=true;try{const r=await posRequest('pay','POST',{id:currentOrder.id});announcePayment(r.order);document.getElementById('status').textContent='✅ รับชำระแล้ว '+money(r.order.total);cart={};currentOrder=null;document.getElementById('createBtn').textContent='สร้างออเดอร์';document.getElementById('createBtn').onclick=createOrder;renderCart()}catch(e){alert(e.message)}finally{btn.disabled=false}}
function enableVoice(){voiceEnabled=true;const u=new SpeechSynthesisUtterance('เปิดระบบประกาศยอดชำระเงินแล้ว');u.lang='th-TH';speechSynthesis.cancel();speechSynthesis.speak(u);const b=document.getElementById('voiceBtn');b.textContent='🔊 เสียงประกาศเปิดอยู่';b.className='smallbtn voice-on'}
function announcePayment(o){if(!voiceEnabled||!o)return;const text=o.order_source==='pos'?'ได้รับชำระจากหน้าร้าน '+Number(o.total).toLocaleString('th-TH')+' บาท':'ได้รับชำระจากลูกค้า '+(o.customer_name||'ออนไลน์')+' ยอดเงิน '+Number(o.total).toLocaleString('th-TH')+' บาท';const u=new SpeechSynthesisUtterance(text);u.lang='th-TH';speechSynthesis.cancel();speechSynthesis.speak(u)}
async function checkPaidFeed(){if(!posToken())return;try{const r=await posRequest('paid-feed&since='+encodeURIComponent(lastFeedTime));for(const o of r.orders||[]){if(!announced.has(o.id)){announced.add(o.id);announcePayment(o)}if(o.paid_at&&o.paid_at>lastFeedTime)lastFeedTime=o.paid_at}if(r.server_time&&r.server_time>lastFeedTime)lastFeedTime=r.server_time}catch(e){console.error('paid feed',e)}}
boot();
</script></body></html>
