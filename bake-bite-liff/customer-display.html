<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Bake & Bite Customer Display</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;--brown:#5b2d1b;--green:#4f8b43;--cream:#fff9ef;--line:#eadbca}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f6efe7;color:#3d2b24}body{min-height:100vh;display:flex;flex-direction:column}
.hero{height:150px;background:#fffaf2 url('bake-bite-header-v2.png?v=20261007') center/cover no-repeat;position:relative;border-bottom:1px solid #e6d7c9}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,250,242,.88) 35%,rgba(255,250,242,.96) 50%,rgba(255,250,242,.88) 65%,transparent 100%)}
.brand{position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--brown)}.brand b{font-size:34px}.brand div{font-weight:800;color:#7b675a}
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:20px;padding:22px;min-height:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px #6d45200d;overflow:hidden}
.left{display:flex;flex-direction:column}.head{padding:20px 24px 12px;display:flex;justify-content:space-between;align-items:end}.head h1{margin:0;color:var(--brown);font-size:30px}.order{font-size:20px;font-weight:950;color:#7c4a35}
.rows{padding:0 24px;overflow:auto;flex:1}.row{display:grid;grid-template-columns:1fr 90px 120px;gap:14px;padding:16px 0;border-bottom:1px solid #eee4da;align-items:center}.name{font-size:22px;font-weight:850}.qty{text-align:center;font-size:20px;font-weight:900}.line{text-align:right;font-size:20px;font-weight:900}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:#8e7c70;padding:40px}.empty .icon{font-size:70px}.empty b{display:block;font-size:26px;color:#684534;margin-top:8px}
.total{margin-top:auto;padding:18px 24px 22px;background:#fff7ed;border-top:1px solid #eadbca;display:flex;align-items:center;justify-content:space-between;font-size:26px;font-weight:950}.total strong{font-size:46px;color:#8b2418}
.right{padding:22px;display:flex;flex-direction:column;justify-content:center;text-align:center}.right h2{font-size:28px;color:var(--brown);margin:0 0 8px}.amount{font-size:52px;font-weight:950;color:#17623a;margin:6px 0}.qr{width:300px;height:300px;margin:10px auto 12px;background:#fff;border:2px solid #e6d8cb;border-radius:22px;display:grid;place-items:center;padding:16px}.qr img,.qr canvas{max-width:265px!important;max-height:265px!important}.hint{font-size:18px;font-weight:850;color:#6e5a4d}.waiting{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:10px 15px;border-radius:999px;background:#fff4dd;color:#825a24;font-weight:900}
.dot{width:11px;height:11px;border-radius:50%;background:#e39a2d;animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scale(1.5);opacity:.55}}
.success{font-size:90px}.thanks{font-size:26px;font-weight:900;color:#2e6737}.idle{font-size:74px}.small{margin-top:12px;color:#8b776b;font-weight:700}
@media(max-width:900px){.main{grid-template-columns:1fr}.right{min-height:440px}}
</style>
</head>
<body>
<div class="hero"><div class="brand"><b>BAKE & BITE</b><div>Customer Display</div></div></div>
<main class="main">
  <section class="panel left">
    <div class="head"><div><h1>รายการของคุณ</h1><div class="small">ตรวจสอบรายการก่อนชำระเงิน</div></div><div id="orderNo" class="order"></div></div>
    <div id="rows" class="rows"></div>
    <div class="total"><span>รวมทั้งหมด</span><strong id="total">฿0</strong></div>
  </section>
  <aside id="payPanel" class="panel right"></aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const KEY='bake_bite_customer_display';
const money=n=>'฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(s){
  s=s||{mode:'cart',items:[],total:0};
  const items=Array.isArray(s.items)?s.items:[];
  orderNo.textContent=s.order_no?'ออเดอร์ '+esc(s.order_no):'';
  rows.innerHTML=items.length?items.map(i=>'<div class="row"><div class="name">'+esc(i.name)+'</div><div class="qty">× '+Number(i.quantity||0)+'</div><div class="line">'+money(i.line_total??Number(i.price||0)*Number(i.quantity||0))+'</div></div>').join(''):'<div class="empty"><div><div class="icon">🥪🥗</div><b>พร้อมรับออเดอร์</b><div>รายการสินค้าจะแสดงที่นี่เมื่อพนักงานเลือกสินค้า</div></div></div>';
  total.textContent=money(s.total);
  if(s.mode==='payment'&&s.promptpay_payload){
    payPanel.innerHTML='<h2>สแกน QR เพื่อชำระเงิน</h2><div class="amount">'+money(s.total)+'</div><div id="qr" class="qr"></div><div class="hint">PromptPay · Bake & Bite</div><div class="waiting"><span class="dot"></span> รอการชำระเงิน</div>';
    if(window.QRCode)new QRCode(document.getElementById('qr'),{text:s.promptpay_payload,width:265,height:265,correctLevel:QRCode.CorrectLevel.M});
  }else if(s.mode==='paid'){
    payPanel.innerHTML='<div class="success">✅</div><h2>ชำระเงินเรียบร้อย</h2><div class="amount">'+money(s.total)+'</div><div class="thanks">ขอบคุณที่ใช้บริการ Bake & Bite</div><div class="small">กรุณารอรับอาหารตามหมายเลขออเดอร์</div>';
  }else{
    payPanel.innerHTML='<div class="idle">😊</div><h2>ขอบคุณที่เลือก Bake & Bite</h2><div class="hint">ยอดชำระและ QR Code จะแสดงอัตโนมัติเมื่อพนักงานเลือก PromptPay / QR</div>';
  }
}
function load(){try{render(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){render(null)}}
window.addEventListener('storage',e=>{if(e.key===KEY)load()});
setInterval(load,1200);load();
</script>
</body>
</html>
