<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สรุป Snack Box · Bake & Bite</title>
<style>
:root{--brown:#5b2d1b;--green:#557d50;--line:#eadbce;--muted:#7b6a60}
*{box-sizing:border-box}html,body{margin:0;background:#f4ede4;color:#402d27;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
.shell{width:min(100%,430px);min-height:100vh;margin:auto;background:#fffaf2;padding-bottom:190px}.hero img{width:100%;aspect-ratio:3/1;object-fit:cover;display:block}
.title{padding:18px}.title h1{font-size:34px;margin:0;color:var(--brown)}.title p{margin:7px 0;color:var(--muted)}
.card{margin:12px 14px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:0 6px 16px rgba(70,45,28,.05)}
.total{font-size:23px;font-weight:950}.total b{color:#315d38;font-size:32px}.type{display:inline-block;margin-top:7px;padding:6px 10px;border-radius:999px;background:#e8f0e2;color:#426341;font-weight:900}
.row{padding:12px 0;border-top:1px dashed #e6d8cc}.row:first-of-type{margin-top:12px}.combo{font-weight:900;line-height:1.5}.qty{color:#315d38;font-weight:950;margin-top:4px}
label{display:block;font-weight:900;margin-bottom:7px}textarea{width:100%;min-height:90px;border:1px solid #ddcec2;border-radius:14px;padding:12px;font:inherit}
.bottom{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),406px);display:grid;grid-template-columns:1fr 1.4fr;gap:8px}.bottom button{border:0;border-radius:18px;padding:15px;font-size:16px;font-weight:950}.back{background:#fff;color:var(--brown);border:1px solid #e3d3c7!important}.confirm{background:var(--green);color:#fff}

.nav{position:fixed;left:0;right:0;bottom:10px;z-index:30;pointer-events:none}
.navin{--notch-left:30%;width:min(calc(100% - 24px),398px);margin:auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:rgba(255,253,248,.985);border:1px solid rgba(90,47,31,.10);border-radius:24px;padding:12px 7px calc(10px + env(safe-area-inset-bottom));box-shadow:0 12px 28px rgba(75,52,35,.16);backdrop-filter:blur(10px);pointer-events:auto;overflow:visible;position:relative}
.navin:before{content:"";position:absolute;left:var(--notch-left);top:-1px;transform:translate(-50%,-1px);width:78px;height:38px;background:#fff8ec;border-radius:0 0 44px 44px;z-index:1;pointer-events:none;box-shadow:0 1px 0 #fff8ec}
.nav a{position:relative;z-index:2;min-height:54px;text-decoration:none;color:#6b4a3a;text-align:center;font-size:11.5px;font-weight:700;line-height:1.15;padding:5px 2px 2px;overflow:visible}
.nav a b{display:flex;width:40px;height:40px;align-items:center;justify-content:center;margin:0 auto 3px;border-radius:50%;font-size:21px;line-height:1;background:transparent;border:0}
.nav a b .snack-nav-svg{display:block!important;width:30px!important;height:24px!important;stroke:#6b4a3a!important}
.nav a b .snack-nav-svg path{stroke:#6b4a3a!important}
.nav a.active{color:#4a281b;font-weight:900}
.nav a.active b{width:56px;height:56px;margin-top:-29px;margin-bottom:5px;background:#5b2d1b;border:4px solid #fff8ef;box-shadow:0 8px 20px rgba(74,40,27,.28);font-size:25px;color:#fff;transform:translateY(-1px)}
.nav a.active b .snack-nav-svg,.nav a.active b .snack-nav-svg path{stroke:#fff!important}
.nav a span{display:block;margin-top:0}
@media(max-width:380px){.navin{width:calc(100% - 18px);padding-left:4px;padding-right:4px}.navin:before{width:72px;height:35px}.nav a{font-size:10.5px}.nav a b{width:37px;height:37px;font-size:19px}.nav a.active b{width:52px;height:52px;font-size:23px;margin-top:-26px}}

</style></head>
<body><div class="shell"><header class="hero"><img src="bake-bite-header-v2.png?v=20260927-0810" alt=""></header>
<section class="title"><h1>สรุป Snack Box</h1><p>ตรวจคู่เมนูและจำนวนก่อนยืนยัน</p></section>
<section class="card"><div class="total">รวม <b id="total">0</b> กล่อง</div><span class="type" id="type"></span><div id="rows"></div></section>
<section class="card"><label for="note">หมายเหตุถึงร้าน</label><textarea id="note" placeholder="เช่น จัดใส่กล่องสวย ๆ / รับเวลา 10:00 น."></textarea></section>
</div><div class="bottom"><button id="back" class="back">← แก้ไข</button><button id="confirm" class="confirm">ยืนยันรายการ</button></div>
<nav class="nav"><div class="navin">
<a href="index.html#order"><b>🛒</b><span>สั่งอาหาร</span></a>
<a class="active" href="snack-box-builder.html"><b><svg class="snack-nav-svg" viewBox="0 0 32 24" width="30" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5h18v13h-18z"/><path d="M2.5 7.5 11.5 3l9 4.5"/><path d="M6 16l5.2-5.2L16.5 16H6z"/><path d="M7.5 13.8h7.4"/><path d="M24 6h4.5v14H24z"/><path d="M25 2.5h2.5V6H25z"/><path d="M24 10h4.5"/></svg></b><span>Snack Box</span></a>
<a href="index.html#points"><b>☆</b><span>สะสมแต้ม</span></a>
<a href="index.html#redeem"><b>🎁</b><span>แลกแต้ม</span></a>
<a href="index.html#contact"><b>💬</b><span>ติดต่อร้าน</span></a>
</div></nav>
<script>
const TEST_PREVIEW=new URLSearchParams(location.search).get('preview')==='1';
document.querySelectorAll('.nav a[href]').forEach(a=>{
  a.dataset.previewNav='1';
  if(TEST_PREVIEW){
    const h=a.getAttribute('href')||'';
    const parts=h.split('#');
    a.setAttribute('href',parts[0]+(parts[0].includes('?')?'&':'?')+'preview=1'+(parts[1]?'#'+parts[1]:''));
  }
});
function go(url){if(TEST_PREVIEW)url+=(url.includes('?')?'&':'?')+'preview=1';location.href=url}
let d=null;try{d=JSON.parse(sessionStorage.getItem('snackBuilder')||'null')}catch(_){}
if(!d||!Array.isArray(d.sets)||!d.sets.length)go('snack-box-builder.html');
const cat=JSON.parse(sessionStorage.getItem('snackBuilderCatalog')||'null');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function render(){
  let catalog=cat;
  if(!catalog){
    const r=await fetch("https://oplwrlljqwgxnrqrdufp.supabase.co/functions/v1/store-api?action=catalog");catalog=await r.json();
  }
  const ps=catalog.products||[];const name=id=>ps.find(p=>String(p.id)===String(id))?.name||'-';
  total.textContent=d.total||d.sets.reduce((s,x)=>s+Number(x.qty||0),0);
  type.textContent='Snack Box '+d.mode+' Step';
  rows.innerHTML=d.sets.map((s,i)=>'<div class="row"><div class="combo">'+(i+1)+') '+esc(name(s.foodId))+' + '+(d.mode===3?esc(name(s.dessertId))+' + ':'')+esc(name(s.drinkId))+'</div><div class="qty">'+Number(s.qty||0)+' กล่อง</div></div>').join('');
}
back.onclick=()=>go('snack-box-builder.html');
confirm.onclick=()=>{
  const note=document.getElementById('note').value.trim();
  sessionStorage.setItem('snackNote',note);
  sessionStorage.setItem('snackOrderDraft',JSON.stringify({...d,note,created_at:new Date().toISOString()}));
  alert('บันทึกรายการ Snack Box แล้ว\nขั้นต่อไปจะเชื่อมการส่งออเดอร์เข้าระบบครัว');
};
render();
</script></body></html>
