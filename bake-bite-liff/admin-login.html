<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>เข้าสู่ระบบ Admin · Bake & Bite</title>
<style>:root{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;color:#422b20;background:#f8f1e9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}main{max-width:420px;width:100%;background:#fffefa;border:1px solid #e9dacb;border-radius:28px;padding:28px;box-shadow:0 20px 50px #64442215}small{font-weight:800;color:#8a694f;letter-spacing:.08em}h1{font-size:30px;color:#5b2d1b;margin:14px 0 8px}p{color:#715d51;line-height:1.5}label{display:block;font-weight:800;margin:20px 0 8px}input{width:100%;font:inherit;font-size:18px;padding:15px;border:1px solid #d8c6b6;border-radius:13px}button{width:100%;border:0;border-radius:13px;background:#659348;color:#fff;font:inherit;font-weight:800;font-size:17px;padding:15px;margin-top:16px}button:disabled{opacity:.6}#message{min-height:24px;color:#b13e38;font-weight:700;font-size:14px}</style></head><body>
<main><small>BAKE & BITE · ADMIN</small><h1>เข้าสู่ระบบหลังร้าน</h1><p>เข้าสู่ระบบก่อนจัดการออเดอร์ เมนูสินค้า และแต้ม</p><form id="form"><label for="password">รหัสผู้ดูแล</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">เข้าสู่หน้า Admin</button></form><p role="alert" id="message"></p></main>
<script src="admin-session.js"></script><script>
if(adminToken())adminRequest('admin-session').then(()=>location.replace('admin-main.html')).catch(()=>{});
document.getElementById('form').onsubmit=async e=>{
 e.preventDefault();const button=document.getElementById('submit');button.disabled=true;
 const password=document.getElementById('password').value;
 try{
  const r=await fetch(ADMIN_API+'?action=admin-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password})});
  const j=await r.json();
  if(!r.ok||!j.ok)throw new Error(j.error==='admin_login_not_configured'?'ยังไม่ได้ตั้งรหัสผู้ดูแลใน Supabase':j.error==='too_many_attempts'?'ลองผิดหลายครั้ง กรุณารอ 15 นาที':'รหัสไม่ถูกต้อง');
  saveAdminToken(j.token);document.getElementById('password').value='';location.replace('admin-main.html');
 }catch(err){document.getElementById('message').textContent=err.message}
 finally{button.disabled=false}
};
</script></body></html>
