<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>Bake & Bite — แถบเมนู 1 Backup</title></head>
<body>
<!--
  แถบเมนู 1 = Floating Navigation รุ่นก่อนทำรอยเว้า
  เก็บไว้เพื่อเรียกคืนได้ง่าย
  Saved from bake-bite-liff/index.html
-->
<style>
/* floating bottom nav */
.nav{position:fixed;left:0;right:0;bottom:10px;z-index:30;pointer-events:none}
.navin{width:min(calc(100% - 24px),398px);margin:auto;display:grid;grid-template-columns:repeat(4,1fr);align-items:end;background:rgba(255,253,248,.985);border:1px solid rgba(90,47,31,.10);border-radius:24px;padding:12px 7px calc(10px + env(safe-area-inset-bottom));box-shadow:0 12px 28px rgba(75,52,35,.16);backdrop-filter:blur(10px);pointer-events:auto;overflow:visible}
.nav button{position:relative;min-height:54px;border:0;background:transparent;border-radius:18px;padding:5px 2px 2px;color:#6b4a3a;font-family:inherit;font-size:11.5px;line-height:1.15;transition:color .22s ease,transform .22s ease;overflow:visible}
.nav button b{display:flex;width:40px;height:40px;align-items:center;justify-content:center;margin:0 auto 3px;border-radius:50%;font-size:21px;line-height:1;background:transparent;border:0;transition:all .22s ease}
.nav button.active{color:#4a281b;font-weight:900;background:transparent}
.nav button.active b{width:56px;height:56px;margin-top:-29px;margin-bottom:5px;background:#5b2d1b;border:4px solid #fff8ef;box-shadow:0 8px 20px rgba(74,40,27,.28);font-size:25px;color:#fff;transform:translateY(-1px)}
.nav button:active b{transform:scale(.95)}
@media(max-width:380px){.navin{width:calc(100% - 18px);padding-left:4px;padding-right:4px}.nav button{font-size:10.5px}.nav button b{width:37px;height:37px;font-size:19px}.nav button.active b{width:52px;height:52px;font-size:23px;margin-top:-26px}}
</style>

<nav class="nav"><div class="navin">
<button data-page="order"><b>🍴</b>สั่งอาหาร</button>
<button data-page="points" class="active"><b>☆</b>สะสมแต้ม</button>
<button data-page="redeem"><b>🎁</b>แลกแต้ม</button>
<button data-page="contact"><b>💬</b>ติดต่อร้าน</button>
</div></nav>

<script>
/* Logic ที่ใช้กับแถบเมนู 1 */
function showPage(id){
  document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));
  history.replaceState({},'',location.pathname+'#'+id);
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body></html>
