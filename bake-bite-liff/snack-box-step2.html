</style></head><body><div class="shell"><header class="header"><img src="bake-bite-header-v2.png?v=20260927-0810" alt="Bake & Bite"></header><div class="title"><h1>Snack Box</h1><p>Step 2 เลือกหมวดของหวาน และเลือกเมนูที่ต้องการ</p></div><div class="steps">

const TEST_PREVIEW=new URLSearchParams(location.search).get('preview')==='1';
function snackTestUrl(url){
  if(!TEST_PREVIEW) return url;
  const parts=url.split('#');
  const p=parts[0], hash=parts[1]?'#'+parts[1]:'';
  return p+(p.includes('?')?'&':'?')+'preview=1'+hash;
}
if(TEST_PREVIEW){
  document.querySelectorAll('a[href]').forEach(a=>{
    const h=a.getAttribute('href')||'';
    if(h && !/^https?:/i.test(h) && !h.startsWith('#')) a.setAttribute('href',snackTestUrl(h));
  });
}
function snackGo(url){ location.href=snackTestUrl(url); }
const data={sweet:[['🍓','แยมสตรอว์เบอร์รี','แซนด์วิชหวานรสผลไม้'],['🫐','แยมบลูเบอร์รี','แซนด์วิชหวานรสผลไม้'],['🍊','แยมส้ม','แซนด์วิชหวานรสผลไม้'],['🍞','สังขยา','กลิ่นหอมละมุน']],bakery:[['🥐','ครัวซองต์หวาน','เบเกอรี่'],['🧁','คัพเค้ก','เบเกอรี่']],fruit:[['🍎','ผลไม้รวม','ผลไม้สด'],['🍉','แตงโม','ผลไม้สด']],snack:[['🍪','คุกกี้','ของทานเล่น'],['🍫','บราวนี่','ของทานเล่น']]};let cat='sweet',choice=null,qty=0;
function render(){items.innerHTML=data[cat].map((x,i)=>'<div class="item '+(choice&&choice.name===x[1]?'selected':'')+'" data-i="'+i+'"><span class="check">✓</span><div class="photo">'+x[0]+'</div><h3>'+x[1]+'</h3><p>'+x[2]+'</p><div class="qty"><button class="minus" data-d="-1">−</button><span>'+(choice&&choice.name===x[1]?qty:0)+'</span><button class="plus" data-d="1">+</button></div></div>').join('')}
document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;choice=null;qty=0;update();render()});
items.onclick=e=>{const item=e.target.closest('.item');if(!item)return;const i=Number(item.dataset.i),d=Number(e.target.dataset.d||0),x=data[cat][i];if(d){choice={cat,name:x[1],icon:x[0]};qty=Math.max(0,(choice.name===x[1]?qty:0)+d);if(qty===0)choice=null}else{choice={cat,name:x[1],icon:x[0]};qty=1}update();render()};
function update(){picked.textContent='เลือกแล้ว '+(choice?1:0)+' รายการ';next.disabled=!choice}next.onclick=()=>{sessionStorage.setItem('snackDessert',JSON.stringify({...choice,qty}));snackGo('snack-box-step3.html')};render();</script></body></html>
