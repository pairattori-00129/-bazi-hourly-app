<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>จัดการสินค้า · Bake & Bite</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;color:#432d22;background:#f8f1e9}*{box-sizing:border-box}body{margin:0;visibility:hidden}body.admin-verified{visibility:visible}main{max-width:740px;margin:auto;padding:24px 16px 80px}
h1{font-size:30px;color:#5b2d1b;margin:8px 0}h2{font-size:23px;margin:0 0 14px}p{line-height:1.5;color:#705d51}small{font-size:14px;color:#8c684f;font-weight:800;letter-spacing:.08em}
section,.item{background:#fffefa;border:1px solid #e9dacb;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 7px 18px #643e220b}
input,select{font:inherit;font-size:16px;width:100%;padding:12px;border:1px solid #d8c7b7;border-radius:13px;background:#fff}input[type=checkbox]{width:auto}label{display:block;font-weight:800;font-size:15px;margin:12px 0 6px}
button{font:inherit;font-size:16px;font-weight:800;border:0;border-radius:13px;background:#669348;color:#fff;padding:13px 17px;cursor:pointer}button:disabled{opacity:.6}.outline{background:#5b2d1b}
nav{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}nav a{font-weight:800;color:#5b2d1b;background:#fff;border:1px solid #e5d7ca;border-radius:12px;padding:10px;text-decoration:none}nav a.active{background:#5b2d1b;color:#fff}
#panel{display:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.muted{font-size:14px;color:#786659}.error{color:#ba4039!important}#message{min-height:24px;font-weight:800}.item{display:flex;justify-content:space-between;align-items:center;gap:10px}.item img{width:54px;height:54px;border-radius:10px;object-fit:cover}
.category-group{margin:20px 0 24px}.category-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;background:#f0f5e9;border-radius:14px;color:#4d653d}.category-head h3{font-size:19px;margin:0}.category-head span{font-size:14px;font-weight:800;white-space:nowrap}.category-group .item{margin:9px 0;border-radius:17px;box-shadow:none}.empty-category{padding:16px 4px 3px;font-size:14px;color:#786659}
.category-summary{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 2px}.category-summary span{padding:7px 10px;border-radius:999px;background:#eff5e9;color:#496239;font-size:14px;font-weight:800}
.photo-picker{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.photo-picker input{position:absolute;width:1px;height:1px;opacity:0}.photo-picker label{display:inline-block;margin:0;padding:13px 17px;border-radius:13px;background:#5b2d1b;color:white;cursor:pointer}.photo-picker input:focus-visible+label{outline:3px solid #82b8f4;outline-offset:3px}.photo-picker img{width:84px;height:84px;border-radius:13px;object-fit:cover;border:1px solid #e9dacb}.photo-picker img[hidden]{display:none}.photo-help{margin:8px 0 0}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<small>BAKE & BITE · ADMIN</small><h1>จัดการเมนูสินค้า</h1><p>เพิ่มรายการ เปลี่ยนราคา รูปภาพ และสถานะขาย</p>
<nav aria-label="หน้าผู้ดูแล"><a href="admin-main.html">หน้าหลัก</a><a href="admin-orders.html">ออเดอร์</a><a class="active" href="admin-products.html">เมนูสินค้า</a><a href="admin.html">ตั้งค่าแต้ม</a></nav>
<p role="status" aria-live="polite" id="message"></p>
<div id="panel">
 <section><h2>หมวดหมู่สินค้า</h2><p>พิมพ์ชื่อหมวดใหม่เองได้ เช่น เบเกอรี่</p><form id="categoryForm"><label for="categoryName">ชื่อหมวดหมู่ใหม่</label><input id="categoryName" required maxlength="100" placeholder="เช่น เบเกอรี่"><button type="submit" style="margin-top:12px">+ เพิ่มหมวดหมู่</button></form><div id="categorySummary" class="category-summary"></div></section>
 <section><h2>รายการสินค้า</h2><div id="products"></div><button class="outline" id="newButton" type="button">+ เพิ่มสินค้า</button></section>
 <section id="editor"><h2 id="formTitle">เพิ่มสินค้า</h2><form id="productForm"><div class="grid"><div><label for="name">ชื่อสินค้า</label><input id="name" required maxlength="120"></div><div><label for="category">หมวดหมู่</label><select id="category" required></select></div><div><label for="price">ราคา (บาท)</label><input id="price" type="number" min="0" max="100000" step="0.01" required></div><div><label>รูปสินค้า</label><div class="photo-picker"><input id="imageFile" type="file" accept="image/*" aria-describedby="photoHelp"><label for="imageFile">📷 เลือกรูปสินค้า</label><img id="imagePreview" alt="ตัวอย่างรูปสินค้า" hidden></div><p class="muted photo-help" id="photoHelp">เลือกรูปจากมือถือ แล้วกดบันทึกสินค้า (สูงสุด 5 MB)</p><input id="imageUrl" type="hidden"></div></div><label for="description">รายละเอียด</label><input id="description" maxlength="500"><label><input type="checkbox" id="active" checked> เปิดขาย</label><button id="saveButton" type="submit">บันทึกสินค้า</button></form></section>
</div>
</main><script src="admin-session.js"></script><script>
let products=[];let categories=[];let editing=null;let previewObjectUrl=null;
const message=document.getElementById('message');
const imageFile=document.getElementById('imageFile'),imagePreview=document.getElementById('imagePreview');
function notice(value,error=false){message.textContent=value;message.classList.toggle('error',error)}
function safe(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(action,body){return adminRequest(action,body?'POST':'GET',body)}
function showImage(url){if(previewObjectUrl){URL.revokeObjectURL(previewObjectUrl);previewObjectUrl=null}imagePreview.hidden=!url;if(url)imagePreview.src=url;else imagePreview.removeAttribute('src')}
function clearForm(){editing=null;document.getElementById('productForm').reset();document.getElementById('active').checked=true;document.getElementById('formTitle').textContent='เพิ่มสินค้า';showImage('')}
imageFile.addEventListener('change',()=>{const file=imageFile.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){notice('กรุณาเลือกรูปภาพ',true);imageFile.value='';return}showImage('');previewObjectUrl=URL.createObjectURL(file);imagePreview.src=previewObjectUrl;imagePreview.hidden=false;notice('เลือกรูปแล้ว กดบันทึกสินค้าเพื่ออัปโหลด')});
async function jpegFromImage(file){
 const url=URL.createObjectURL(file);
 try{
  const img=new Image();img.src=url;await img.decode();
  const scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
  const canvas=document.createElement('canvas');canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);
  if(!canvas.width||!canvas.height)throw new Error('เปิดรูปนี้ไม่ได้ กรุณาเลือกรูปอื่น');
  const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
  return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('แปลงรูปไม่สำเร็จ กรุณาเลือกรูปอื่น')),'image/jpeg',.86));
 }finally{URL.revokeObjectURL(url)}
}
async function uploadImage(file){
 const blob=await jpegFromImage(file);
 if(blob.size>5*1024*1024)throw new Error('รูปใหญ่เกิน 5 MB กรุณาเลือกรูปอื่น');
 const form=new FormData();form.append('image',blob,'product.jpg');
 const response=await fetch(ADMIN_API+'?action=admin-upload-image',{method:'POST',headers:{authorization:'Bearer '+adminToken()},body:form});
 const result=await response.json();
 if(response.status===401){clearAdminToken();location.replace('admin-login.html');throw new Error('กรุณาเข้าสู่ระบบใหม่')}
 if(!response.ok||!result.ok)throw new Error(result.error==='invalid_image'?'รูปนี้ใช้ไม่ได้ กรุณาเลือกรูปอื่น':result.error==='image_too_large'?'รูปใหญ่เกิน 5 MB':'อัปโหลดรูปไม่สำเร็จ กรุณาลองใหม่');
 return result.url||result.image_url;
}
function render(){
 document.getElementById('category').innerHTML=categories.map(c=>'<option value="'+safe(c.id)+'">'+safe(c.name)+'</option>').join('');
 document.getElementById('categorySummary').innerHTML=categories.map(c=>'<span>'+safe(c.name)+'</span>').join('');
 const item=p=>'<div class="item"><div style="display:flex;align-items:center;gap:12px">'+(p.image_url?'<img src="'+safe(p.image_url)+'" alt="">':'')+'<div><strong>'+safe(p.name)+'</strong><div class="muted">฿'+Number(p.price).toLocaleString('th-TH')+(p.is_active?'':' · ปิดขาย')+'</div></div></div><button type="button" data-id="'+safe(p.id)+'">แก้ไข</button></div>';
 const groups=categories.map(c=>({name:c.name,items:products.filter(p=>p.category_id===c.id)}));
 const uncategorized=products.filter(p=>!categories.some(c=>c.id===p.category_id));
 if(uncategorized.length)groups.push({name:'อื่น ๆ',items:uncategorized});
 document.getElementById('products').innerHTML=groups.length?groups.map(g=>
   '<div class="category-group"><div class="category-head"><h3>'+safe(g.name)+'</h3><span>'+g.items.length+' รายการ</span></div>'+
   (g.items.length?g.items.map(item).join(''):'<div class="empty-category">ยังไม่มีสินค้าในหมวดนี้</div>')+'</div>'
 ).join(''):'<p>ยังไม่มีหมวดหมู่สินค้า</p>';
}
async function load(){const j=await api('admin-list');products=j.products||[];categories=j.categories||[];render();notice('โหลดสินค้า '+products.length+' รายการ')}
requireAdmin().then(async ok=>{if(ok){document.getElementById('panel').style.display='block';try{await load()}catch(e){notice(e.message,true)}}});
document.getElementById('products').onclick=e=>{const b=e.target.closest('button[data-id]');if(!b)return;const p=products.find(x=>x.id===b.dataset.id);if(!p)return;clearForm();editing=p.id;document.getElementById('formTitle').textContent='แก้ไข '+p.name;document.getElementById('name').value=p.name;document.getElementById('category').value=p.category_id;document.getElementById('price').value=p.price;document.getElementById('imageUrl').value=p.image_url||'';showImage(p.image_url||'');document.getElementById('description').value=p.description||'';document.getElementById('active').checked=p.is_active;document.getElementById('editor').scrollIntoView({behavior:'smooth'})};
document.getElementById('newButton').onclick=()=>{clearForm();document.getElementById('editor').scrollIntoView({behavior:'smooth'})};
document.getElementById('productForm').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('saveButton');b.disabled=true;try{let imageUrl=document.getElementById('imageUrl').value;if(imageFile.files?.[0]){notice('กำลังอัปโหลดรูปสินค้า…');imageUrl=await uploadImage(imageFile.files[0]);document.getElementById('imageUrl').value=imageUrl;imageFile.value='';showImage(imageUrl)}notice('กำลังบันทึกสินค้า…');await api('admin-save-product',{id:editing,category_id:document.getElementById('category').value,name:document.getElementById('name').value.trim(),price:Number(document.getElementById('price').value),image_url:imageUrl||null,description:document.getElementById('description').value.trim(),is_active:document.getElementById('active').checked});await load();clearForm();notice('บันทึกสินค้าแล้ว หน้าลูกค้าจะเห็นรูปใหม่')}catch(err){notice(err.message,true)}finally{b.disabled=false}};
document.getElementById('categoryForm').onsubmit=async e=>{e.preventDefault();const name=document.getElementById('categoryName').value.trim();if(!name)return;const button=e.target.querySelector('button');button.disabled=true;try{const result=await api('admin-save-category',{name});await load();document.getElementById('category').value=result.category.id;document.getElementById('categoryName').value='';notice('เพิ่มหมวด “'+name+'” แล้ว เลือกหมวดนี้ให้สินค้าที่เพิ่มได้เลย')}catch(err){notice(err.message==='category_already_exists'?'มีหมวดหมู่นี้อยู่แล้ว':err.message,true)}finally{button.disabled=false}};
</script></body></html>
