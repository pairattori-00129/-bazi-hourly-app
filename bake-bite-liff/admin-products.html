<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>จัดการสินค้า · Bake & Bite</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;color:#432d22;background:#f8f1e9}*{box-sizing:border-box}body{margin:0;visibility:hidden}body.admin-verified{visibility:visible}main{max-width:740px;margin:auto;padding:24px 16px 80px}
h1{font-size:30px;color:#5b2d1b;margin:8px 0}h2{font-size:23px;margin:0 0 14px}p{line-height:1.5;color:#705d51}small{font-size:14px;color:#8c684f;font-weight:800;letter-spacing:.08em}
section,.item{background:#fffefa;border:1px solid #e9dacb;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 7px 18px #643e220b}
input,select{font:inherit;font-size:16px;width:100%;padding:12px;border:1px solid #d8c7b7;border-radius:13px;background:#fff}input[type=checkbox]{width:auto}label{display:block;font-weight:800;font-size:15px;margin:12px 0 6px}
button{font:inherit;font-size:16px;font-weight:800;border:0;border-radius:13px;background:#669348;color:#fff;padding:13px 17px;cursor:pointer}button:disabled{opacity:.6}.outline{background:#5b2d1b}
nav{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}nav a{font-weight:800;color:#5b2d1b;background:#fff;border:1px solid #e5d7ca;border-radius:12px;padding:10px;text-decoration:none}nav a.active{background:#5b2d1b;color:#fff}
#panel{display:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.muted{font-size:14px;color:#786659}.error{color:#ba4039!important}#message{min-height:24px;font-weight:800}.item{display:flex;justify-content:space-between;align-items:center;gap:10px}.item img{width:54px;height:54px;border-radius:10px;object-fit:cover}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<small>BAKE & BITE · ADMIN</small><h1>จัดการเมนูสินค้า</h1><p>เพิ่มรายการ เปลี่ยนราคา รูปภาพ และสถานะขาย</p>
<nav aria-label="หน้าผู้ดูแล"><a href="admin-main.html">หน้าหลัก</a><a href="admin-orders.html">ออเดอร์</a><a class="active" href="admin-products.html">เมนูสินค้า</a><a href="admin.html">ตั้งค่าแต้ม</a></nav>
<div id="panel">
 <section><h2>รายการสินค้า</h2><div id="products"></div><button class="outline" id="newButton" type="button">+ เพิ่มสินค้า</button></section>
 <section id="editor"><h2 id="formTitle">เพิ่มสินค้า</h2><form id="productForm"><div class="grid"><div><label for="name">ชื่อสินค้า</label><input id="name" required maxlength="120"></div><div><label for="category">หมวดหมู่</label><select id="category" required></select></div><div><label for="price">ราคา (บาท)</label><input id="price" type="number" min="0" max="100000" step="0.01" required></div><div><label for="imageUrl">ลิงก์รูปสินค้า</label><input id="imageUrl" type="url" placeholder="https://..."></div></div><label for="description">รายละเอียด</label><input id="description" maxlength="500"><label><input type="checkbox" id="active" checked> เปิดขาย</label><button id="saveButton" type="submit">บันทึกสินค้า</button></form></section>
 <section><h2>เพิ่มหมวดหมู่</h2><form id="categoryForm"><label for="categoryName">ชื่อหมวดหมู่</label><input id="categoryName" required maxlength="100" placeholder="เช่น เครื่องดื่ม"><button type="submit" style="margin-top:12px">เพิ่มหมวดหมู่</button></form></section>
</div><p role="status" aria-live="polite" id="message"></p>
</main><script src="admin-session.js"></script><script>
let products=[];let categories=[];let editing=null;
const message=document.getElementById('message');
function notice(value,error=false){message.textContent=value;message.classList.toggle('error',error)}
function safe(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(action,body){return adminRequest(action,body?'POST':'GET',body)}
function clearForm(){editing=null;document.getElementById('productForm').reset();document.getElementById('active').checked=true;document.getElementById('formTitle').textContent='เพิ่มสินค้า'}
function render(){
 document.getElementById('category').innerHTML=categories.map(c=>'<option value="'+safe(c.id)+'">'+safe(c.name)+'</option>').join('');
 document.getElementById('products').innerHTML=products.length?products.map(p=>'<div class="item"><div style="display:flex;align-items:center;gap:12px">'+(p.image_url?'<img src="'+safe(p.image_url)+'" alt="">':'')+'<div><strong>'+safe(p.name)+'</strong><div class="muted">฿'+Number(p.price).toLocaleString('th-TH')+' · '+safe(categories.find(c=>c.id===p.category_id)?.name||'')+(p.is_active?'':' · ปิดขาย')+'</div></div></div><button type="button" data-id="'+safe(p.id)+'">แก้ไข</button></div>').join(''):'<p>ยังไม่มีสินค้า</p>';
}
async function load(){const j=await api('admin-list');products=j.products||[];categories=j.categories||[];render();notice('โหลดสินค้า '+products.length+' รายการ')}
requireAdmin().then(async ok=>{if(ok){document.getElementById('panel').style.display='block';try{await load()}catch(e){notice(e.message,true)}}});
document.getElementById('products').onclick=e=>{const b=e.target.closest('button[data-id]');if(!b)return;const p=products.find(x=>x.id===b.dataset.id);if(!p)return;editing=p.id;document.getElementById('formTitle').textContent='แก้ไข '+p.name;document.getElementById('name').value=p.name;document.getElementById('category').value=p.category_id;document.getElementById('price').value=p.price;document.getElementById('imageUrl').value=p.image_url||'';document.getElementById('description').value=p.description||'';document.getElementById('active').checked=p.is_active;document.getElementById('editor').scrollIntoView({behavior:'smooth'})};
document.getElementById('newButton').onclick=()=>{clearForm();document.getElementById('editor').scrollIntoView({behavior:'smooth'})};
document.getElementById('productForm').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('saveButton');b.disabled=true;try{await api('admin-save-product',{id:editing,category_id:document.getElementById('category').value,name:document.getElementById('name').value.trim(),price:Number(document.getElementById('price').value),image_url:document.getElementById('imageUrl').value.trim()||null,description:document.getElementById('description').value.trim(),is_active:document.getElementById('active').checked});await load();clearForm();notice('บันทึกสินค้าแล้ว หน้าลูกค้าจะเห็นข้อมูลใหม่')}catch(err){notice(err.message,true)}finally{b.disabled=false}};
document.getElementById('categoryForm').onsubmit=async e=>{e.preventDefault();const name=document.getElementById('categoryName').value.trim();if(!name)return;try{await api('admin-save-category',{name});await load();document.getElementById('categoryName').value='';notice('เพิ่มหมวดหมู่แล้ว')}catch(err){notice(err.message,true)}};
</script></body></html>
