<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bake & Bite Admin</title><style>
:root{--bg:#f7f2ea;--card:#fff;--brown:#5a3525;--green:#748f60;--green2:#e8f0df;--peach:#f5e4d8;--line:#eadfd5;--muted:#8a776b;--red:#b9574e}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:var(--bg);color:#3f2d25}.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.top img{width:90px}.brand{display:flex;align-items:center;gap:12px}.brand h1{margin:0;font-size:26px}.sub{color:var(--muted);font-size:14px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.green{background:var(--green);color:#fff}.dark{background:#4d4a47;color:#fff}.soft{background:#efe5db;color:#4f3b30}.danger{background:#f3d8d5;color:#9d413b}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tab{border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:#fff;color:#604b3f}.tab.active{background:var(--green);color:#fff}.hidden{display:none}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 5px 15px rgba(70,45,25,.05)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}.stat b{display:block;font-size:26px;margin-top:4px}.board{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.order{border:1px solid #eee0d6;border-radius:16px;padding:13px;margin-bottom:10px}.head{display:flex;justify-content:space-between;gap:10px}.badge{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#fff0bf}.items{color:#6d5b50;font-size:14px;margin:8px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.detail h2{margin-top:0}.detail table{width:100%;border-collapse:collapse}.detail td,.detail th{padding:9px;border-bottom:1px solid #eee;text-align:left}.total{text-align:right;font-size:24px;font-weight:900;margin-top:12px}

/* products */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.toolbar h2{margin:0}.toolbar .right{display:flex;gap:8px;flex-wrap:wrap}
.catbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.catbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.catbtn.active{background:var(--green2);border-color:#c9d9bd;color:#4f6a42}
.product-list{display:block}.category-section{margin:14px 0 18px;border-radius:22px;padding:14px;border:1px solid var(--line)}.category-section:nth-child(4n+1){background:linear-gradient(135deg,#eef4e5,#f8fbf3)}.category-section:nth-child(4n+2){background:linear-gradient(135deg,#fee9dd,#fff5ef)}.category-section:nth-child(4n+3){background:linear-gradient(135deg,#fde3e1,#fff3f2)}.category-section:nth-child(4n){background:linear-gradient(135deg,#fff1d7,#fff8ea)}.category-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.category-title h3{margin:0;font-size:22px;color:#4a2d22}.category-count{font-size:12px;color:#78685f;background:rgba(255,255,255,.7);padding:6px 10px;border-radius:999px}.category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product-card{border:1px solid rgba(232,219,208,.95);border-radius:18px;padding:10px;background:rgba(255,255,255,.94);display:flex;flex-direction:column;gap:8px;align-items:stretch}.product-card img,.ph{width:100%;height:120px;border-radius:14px;object-fit:cover;background:#f3ece5;display:grid;place-items:center;font-size:46px}.product-name{font-size:17px;font-weight:900;margin-bottom:4px}.meta{font-size:13px;color:var(--muted);margin-bottom:8px}.price{font-size:22px;font-weight:900;color:#577347}.switchrow{display:flex;align-items:center;gap:8px;margin:8px 0}.switch{position:relative;width:46px;height:26px;background:#d7d0ca;border-radius:999px;cursor:pointer}.switch.on{background:#7b9a64}.switch:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:white;top:3px;left:3px;transition:.2s}.switch.on:after{left:23px}.mini{padding:7px 9px;border-radius:10px;border:0;font-weight:800;cursor:pointer}.edit{background:#efe5db}.move{background:#edf1ea}.del{background:#f5dfdd;color:#9b453e}
.form-card{margin-top:14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px}.uploadbox{border:2px dashed #d8c8ba;border-radius:16px;padding:14px;text-align:center;background:#fffaf5}.preview{width:120px;height:120px;object-fit:cover;border-radius:16px;background:#f1e9e2;margin:8px auto;display:block}.row{display:flex;gap:8px;flex-wrap:wrap}.category-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.category-chip{background:#f3eee8;border:1px solid var(--line);border-radius:999px;padding:8px 11px;display:flex;gap:8px;align-items:center}.category-chip button{border:0;background:transparent;color:var(--red);font-weight:900;cursor:pointer}

@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}} @media(max-width:480px){.category-grid{grid-template-columns:1fr}}
@media print{.wrap>.top,.stats,.list,.tabs{display:none!important}.board{display:block}.detail{border:0;box-shadow:none}.actions{display:none}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand"><img src="../bake-bite-liff/logo.svg"><div><h1>Bake & Bite Admin</h1><div class="sub">ระบบหลังร้าน</div></div></div><a class="btn soft" href="../bake-bite-liff/#order">เปิดหน้าร้าน</a></div>

<div class="tabs">
<button class="tab active" onclick="showTab('orders',this)">ออเดอร์</button>
<button class="tab" onclick="showTab('products',this)">จัดการรายการอาหาร</button>
</div>

<section id="ordersTab">
<div class="stats">
  <div class="stat">รอรับออเดอร์<b id="statPending">0</b></div>
  <div class="stat">ยืนยันแล้ว<b id="statConfirmed">0</b></div>
  <div class="stat">กำลังทำ<b id="statPreparing">0</b></div>
  <div class="stat">พร้อมรับ<b id="statReady">0</b></div>
  <div class="stat">เสร็จสิ้น<b id="statCompleted">0</b></div>
</div>
<div class="board">
  <div class="card list"><div class="toolbar"><h2>ออเดอร์</h2><button class="btn soft" onclick="loadOrders()">รีเฟรช</button></div><div id="orderList"><div class="sub">กำลังโหลดออเดอร์...</div></div></div>
  <div class="card detail"><h2>รายละเอียดออเดอร์</h2><div id="detail"><div class="sub">เลือกออเดอร์จากด้านซ้าย</div></div></div>
</div></section>

<section id="productsTab" class="hidden">
<div class="card">
  <div class="toolbar"><h2>จัดการรายการอาหาร</h2><div class="right"><button class="btn soft" onclick="toggleCategoryBox()">+ เพิ่มหมวดอาหาร</button><button class="btn green" onclick="openAdd()">+ เพิ่มรายการอาหาร</button></div></div>
  <div id="categoryBox" class="hidden" style="margin-bottom:14px"><div class="row"><input id="newCategory" class="field" style="max-width:320px" placeholder="ชื่อหมวดอาหาร"><button class="btn green" onclick="addCategory()">บันทึกหมวด</button></div><div id="categoryList" class="category-list"></div></div>
  <div id="catBar" class="catbar"></div>
  <div id="productList" class="product-list"></div>
</div>

<div id="formCard" class="card form-card hidden">
  <div class="toolbar"><h2 id="formTitle">เพิ่มรายการอาหาร</h2><button class="btn soft" onclick="closeForm()">ปิด</button></div>
  <input type="hidden" id="editId">
  <div class="formgrid">
    <div>
      <label>หมวดอาหาร</label>
      <select id="pCategory" class="field"></select>
    </div>
    <div>
      <label>ชื่ออาหาร</label>
      <input id="pName" class="field" placeholder="เช่น สลัดโรลไส้ปูอัด">
    </div>
    <div>
      <label>ราคา</label>
      <input id="pPrice" class="field" type="number" min="0" placeholder="45">
    </div>
    <div>
      <label>สถานะสินค้า</label>
      <select id="pActive" class="field"><option value="1">เปิดขาย</option><option value="0">ปิดขาย</option></select>
    </div>
  </div>
  <div class="uploadbox" style="margin-top:12px">
    <b>รูปภาพอาหาร</b>
    <input id="pImage" type="file" accept="image/*" class="field" style="margin-top:8px" onchange="previewImage(this)">
    <img id="imgPreview" class="preview" alt="">
    <div class="sub">เลือกรูปจากเครื่องเพื่อใช้กับเมนูนี้</div>
  </div>
  <button class="btn green" style="margin-top:12px" onclick="saveProduct()">บันทึกรายการอาหาร</button>
</div>
</section>
</div>

<script>
function showTab(tab,btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');ordersTab.classList.toggle('hidden',tab!=='orders');productsTab.classList.toggle('hidden',tab!=='products')}
const STATUS_LABEL={pending:'รอรับออเดอร์',confirmed:'ยืนยันแล้ว',preparing:'กำลังทำ',ready:'พร้อมรับ',completed:'เสร็จสิ้น',cancelled:'ยกเลิก'};
const PAY_LABEL={unpaid:'ยังไม่ชำระ',pending:'รอตรวจสอบชำระเงิน',paid:'ชำระแล้ว',failed:'ชำระไม่สำเร็จ',refunded:'คืนเงิน'};
const DEL_LABEL={waiting_payment:'รอชำระเงิน',waiting_lineman:'รอเรียก LINE MAN',driver_called:'เรียก LINE MAN แล้ว',driver_picked_up:'ไรเดอร์รับอาหารแล้ว',delivered:'จัดส่งสำเร็จ',cancelled:'ยกเลิกการจัดส่ง'};
let orders=[]; let currentOrder=null;

function fmtTime(v){try{return new Date(v).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})}catch(e){return v||''}}
async function loadOrders(){
  if(!ADMIN_TOKEN)return;
  try{
    orders=await rpc('bb_admin_orders',{p_token:ADMIN_TOKEN})||[];
    renderOrderList();
  }catch(e){console.error(e);orderList.innerHTML='<div class="sub">โหลดออเดอร์ไม่สำเร็จ</div>'}
}
function renderOrderList(){
  const counts={pending:0,confirmed:0,preparing:0,ready:0,completed:0};
  orders.forEach(o=>{if(counts[o.status]!==undefined)counts[o.status]++});
  statPending.textContent=counts.pending;statConfirmed.textContent=counts.confirmed;statPreparing.textContent=counts.preparing;statReady.textContent=counts.ready;statCompleted.textContent=counts.completed;
  orderList.innerHTML=orders.map(o=>{
    const delivery=o.fulfillment_method==='lineman'?'<div class="sub">🛵 LINE MAN · '+(DEL_LABEL[o.delivery_status]||'-')+'</div>':'<div class="sub">🏪 รับเองที่ร้าน</div>';
    return '<div class="order"><div class="head"><div><b>'+o.order_no+'</b><div class="sub">'+fmtTime(o.created_at)+' · '+(o.customer_name||'ลูกค้า LINE')+'</div></div><span class="badge">'+(STATUS_LABEL[o.status]||o.status)+'</span></div>'+delivery+'<div class="items">ยอดรวม ฿'+Number(o.total||0).toLocaleString()+' · '+(PAY_LABEL[o.payment_status]||o.payment_status)+'</div><div class="actions"><button class="btn soft" onclick="openOrder(\''+o.id+'\')">ดูรายละเอียด</button><button class="btn dark" onclick="openOrder(\''+o.id+'\').then(()=>setTimeout(()=>print(),100))">พิมพ์ใบออเดอร์</button></div></div>'
  }).join('')||'<div class="sub">ยังไม่มีออเดอร์</div>';
}
async function openOrder(id){
  try{
    const data=await rpc('bb_admin_order_detail',{p_token:ADMIN_TOKEN,p_order_id:id});
    currentOrder=data.order;
    const items=data.items||[];
    renderOrderDetail(currentOrder,items);
  }catch(e){alert('โหลดรายละเอียดออเดอร์ไม่สำเร็จ')}
}
function renderOrderDetail(o,items){
  const deliveryBlock=o.fulfillment_method==='lineman'
   ? '<div class="card" style="margin:12px 0;background:#f0f8eb"><b>จัดส่งด้วย LINE MAN</b><div>ผู้รับ: '+(o.recipient_name||'-')+'</div><div>โทร: '+(o.recipient_phone||'-')+'</div><div>ที่อยู่: '+(o.delivery_address||'-')+'</div><div>สถานะจัดส่ง: <b>'+(DEL_LABEL[o.delivery_status]||'-')+'</b></div></div>'
   : '<div class="card" style="margin:12px 0;background:#fff8ef"><b>รับเองที่ร้าน</b></div>';
  const next={pending:'confirmed',confirmed:'preparing',preparing:'ready',ready:'completed'}[o.status];
  let actions='';
  if(o.payment_status!=='paid') actions+='<button class="btn green" onclick="markPaid()">ยืนยันชำระเงิน</button>';
  if(next) actions+='<button class="btn green" onclick="advanceOrder(\''+next+'\')">เปลี่ยนเป็น '+STATUS_LABEL[next]+'</button>';
  if(o.fulfillment_method==='lineman' && o.payment_status==='paid' && o.delivery_status==='waiting_lineman') actions+='<button class="btn dark" onclick="callLineman()">เรียก LINE MAN</button>';
  if(o.fulfillment_method==='lineman' && o.delivery_status==='driver_called') actions+='<button class="btn dark" onclick="setDelivery(\'driver_picked_up\')">ไรเดอร์รับอาหารแล้ว</button>';
  if(o.fulfillment_method==='lineman' && o.delivery_status==='driver_picked_up') actions+='<button class="btn dark" onclick="setDelivery(\'delivered\')">จัดส่งสำเร็จ</button>';
  actions+='<button class="btn dark" onclick="print()">พิมพ์ใบออเดอร์</button>';
  detail.innerHTML='<div><b style="font-size:20px">'+o.order_no+'</b><div class="sub">'+fmtTime(o.created_at)+' · '+(o.customer_name||'ลูกค้า LINE')+'</div></div><table><tr><th>รายการ</th><th>จำนวน</th><th>ราคา</th></tr>'+items.map(i=>'<tr><td>'+i.product_name+'</td><td>'+i.quantity+'</td><td>฿'+Number(i.line_total).toLocaleString()+'</td></tr>').join('')+'</table><div class="total">รวม ฿'+Number(o.total||0).toLocaleString()+'</div><p><b>สถานะอาหาร:</b> '+(STATUS_LABEL[o.status]||o.status)+'</p><p><b>การชำระเงิน:</b> '+(PAY_LABEL[o.payment_status]||o.payment_status)+'</p>'+deliveryBlock+'<p><b>หมายเหตุ:</b> '+(o.note||'-')+'</p><div class="actions">'+actions+'</div>';
}
async function updateOrder(status,payment,delivery){
  if(!currentOrder)return;
  try{
    const o=await rpc('bb_admin_update_order',{p_token:ADMIN_TOKEN,p_order_id:currentOrder.id,p_status:status||null,p_payment_status:payment||null,p_delivery_status:delivery||null});
    await loadOrders();await openOrder(o.id);
  }catch(e){alert('อัปเดตออเดอร์ไม่สำเร็จ')}
}
function markPaid(){updateOrder(null,'paid',null)}
function advanceOrder(s){updateOrder(s,null,null)}
function setDelivery(s){updateOrder(null,null,s)}
function callLineman(){
  if(!currentOrder||currentOrder.payment_status!=='paid')return alert('ต้องยืนยันการชำระเงินก่อน');
  updateOrder(null,null,'driver_called');
  alert('บันทึกสถานะเรียก LINE MAN แล้ว\nขั้นเชื่อม API เรียกไรเดอร์จริงจะต่อเมื่อมีสิทธิ์ LINE MAN integration');
}

const SUPABASE_URL='https://oplwrlljqwgxnrqrdufp.supabase.co';
const SUPABASE_KEY='sb_publishable_Qjzm-LdsvvOZPYMxBfoKyg_iGCUpo5N';
let ADMIN_TOKEN=sessionStorage.getItem('bb_admin_token')||'';
let categories=[];
let products=[];
let currentCat='ทั้งหมด';

async function rpc(fn,body){
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{
    method:'POST',
    headers:{'apikey':SUPABASE_KEY,'authorization':'Bearer '+SUPABASE_KEY,'content-type':'application/json'},
    body:JSON.stringify(body||{})
  });
  const txt=await r.text();
  if(!r.ok) throw new Error(txt||('HTTP '+r.status));
  return txt?JSON.parse(txt):null;
}
async function ensureLogin(){
  while(!ADMIN_TOKEN){
    ADMIN_TOKEN=prompt('รหัสผ่านผู้ดูแล Bake & Bite')||'';
    if(!ADMIN_TOKEN) return false;
  }
  try{
    await Promise.all([loadAdminCatalog(),loadOrders()]);
    sessionStorage.setItem('bb_admin_token',ADMIN_TOKEN);
    return true;
  }catch(e){
    sessionStorage.removeItem('bb_admin_token');ADMIN_TOKEN='';
    alert('รหัสผ่านไม่ถูกต้อง');
    return ensureLogin();
  }
}
async function loadAdminCatalog(){
  const data=await rpc('bb_admin_catalog',{p_token:ADMIN_TOKEN});
  categories=data.categories||[];
  products=data.products||[];
  renderCategories();renderProducts();
}
function categoryName(id){return (categories.find(c=>c.id===id)||{}).name||'ไม่ทราบหมวด'}
function renderCategories(){
  catBar.innerHTML=['ทั้งหมด',...categories.map(c=>c.name)].map(c=>'<button class="catbtn '+(currentCat===c?'active':'')+'" onclick="filterCat(\''+c.replace(/'/g,"\\'")+'\')">'+c+'</button>').join('');
  categoryList.innerHTML=categories.map(c=>'<span class="category-chip">'+c.name+' <button onclick="deleteCategory(\''+c.id+'\')">×</button></span>').join('');
  pCategory.innerHTML=categories.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('');
}
function productCard(p){
  const list=products.filter(x=>x.category_id===p.category_id).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const pos=list.findIndex(x=>x.id===p.id);
  return '<div class="product-card"><div>'+(p.image_url?'<img src="'+p.image_url+'">':'<div class="ph">🍽️</div>')+'</div><div class="product-name">'+p.name+'</div><div class="meta">'+categoryName(p.category_id)+'</div><div class="price">฿'+Number(p.price).toLocaleString()+'</div><div class="switchrow"><div class="switch '+(p.is_active?'on':'')+'" onclick="toggleActive(\''+p.id+'\')"></div><span>'+(p.is_active?'เปิดขาย':'ปิดขาย')+'</span></div><div class="actions"><button class="mini edit" onclick="editProduct(\''+p.id+'\')">แก้ไข</button><button class="mini move" onclick="moveProduct(\''+p.id+'\',-1)">↑</button><button class="mini move" onclick="moveProduct(\''+p.id+'\',1)">↓</button><button class="mini del" onclick="deleteProduct(\''+p.id+'\')">ลบ</button></div></div>';
}
function renderProducts(){
  const cats=currentCat==='ทั้งหมด'?categories:categories.filter(c=>c.name===currentCat);
  productList.innerHTML=cats.map(c=>{
    const list=products.filter(p=>p.category_id===c.id).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    return '<section class="category-section"><div class="category-title"><h3>'+c.name+'</h3><span class="category-count">'+list.length+' รายการ</span></div><div class="category-grid">'+(list.map(productCard).join('')||'<div class="sub">ยังไม่มีรายการอาหารในหมวดนี้</div>')+'</div></section>';
  }).join('');
}
function filterCat(c){currentCat=c;renderCategories();renderProducts()}
function toggleCategoryBox(){categoryBox.classList.toggle('hidden');renderCategories()}
async function addCategory(){
  const v=newCategory.value.trim();if(!v)return;
  const slug='cat-'+Date.now();
  try{
    await rpc('bb_admin_save_category',{p_token:ADMIN_TOKEN,p_id:null,p_name:v,p_slug:slug,p_sort_order:categories.length+1,p_is_active:true});
    newCategory.value='';await loadAdminCatalog();
  }catch(e){alert('เพิ่มหมวดไม่สำเร็จ')}
}
async function deleteCategory(id){
  if(products.some(p=>p.category_id===id))return alert('ยังมีสินค้าอยู่ในหมวดนี้ กรุณาย้ายสินค้าก่อน');
  if(!confirm('ต้องการลบหมวดนี้หรือไม่?'))return;
  try{await rpc('bb_admin_delete_category',{p_token:ADMIN_TOKEN,p_id:id});await loadAdminCatalog()}catch(e){alert('ลบหมวดไม่สำเร็จ')}
}
function openAdd(){
  formTitle.textContent='เพิ่มรายการอาหาร';editId.value='';pName.value='';pPrice.value='';pActive.value='1';imgPreview.removeAttribute('src');formCard.classList.remove('hidden');renderCategories();formCard.scrollIntoView({behavior:'smooth'})
}
function closeForm(){formCard.classList.add('hidden')}
function previewImage(input){
  const f=input.files&&input.files[0];if(!f)return;
  const img=new Image();const reader=new FileReader();
  reader.onload=()=>{img.onload=()=>{
    const max=700,scale=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);imgPreview.src=c.toDataURL('image/jpeg',.76)
  };img.src=reader.result};reader.readAsDataURL(f)
}
async function saveProduct(){
  const name=pName.value.trim(),price=Number(pPrice.value);if(!name||isNaN(price))return alert('กรุณากรอกชื่ออาหารและราคา');
  const id=editId.value||null;
  const old=products.find(x=>x.id===id);
  const sort=id?(old?.sort_order||0):(products.filter(x=>x.category_id===pCategory.value).length+1);
  try{
    await rpc('bb_admin_save_product',{
      p_token:ADMIN_TOKEN,p_id:id,p_category_id:pCategory.value,p_name:name,p_price:price,
      p_image_url:(imgPreview.getAttribute('src')||old?.image_url||null),p_is_active:pActive.value==='1',p_sort_order:sort
    });
    await loadAdminCatalog();closeForm();alert('บันทึกแล้ว หน้าสั่งอาหารจะใช้ข้อมูลนี้');
  }catch(e){alert('บันทึกไม่สำเร็จ')}
}
function editProduct(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  editId.value=p.id;formTitle.textContent='แก้ไขรายการอาหาร';pCategory.value=p.category_id;pName.value=p.name;pPrice.value=p.price;pActive.value=p.is_active?'1':'0';
  if(p.image_url)imgPreview.src=p.image_url;else imgPreview.removeAttribute('src');
  formCard.classList.remove('hidden');formCard.scrollIntoView({behavior:'smooth'})
}
async function toggleActive(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  try{await rpc('bb_admin_save_product',{p_token:ADMIN_TOKEN,p_id:p.id,p_category_id:p.category_id,p_name:p.name,p_price:Number(p.price),p_image_url:p.image_url||null,p_is_active:!p.is_active,p_sort_order:p.sort_order||0});await loadAdminCatalog()}catch(e){alert('อัปเดตสถานะไม่สำเร็จ')}
}
async function deleteProduct(id){
  const p=products.find(x=>x.id===id);if(!p||!confirm('ลบ '+p.name+' ?'))return;
  try{await rpc('bb_admin_delete_product',{p_token:ADMIN_TOKEN,p_id:id});await loadAdminCatalog()}catch(e){alert('ลบสินค้าไม่สำเร็จ')}
}
async function moveProduct(id,dir){
  const p=products.find(x=>x.id===id);if(!p)return;
  const list=products.filter(x=>x.category_id===p.category_id).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const i=list.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=list.length)return;
  const q=list[j],a=p.sort_order||i+1,b=q.sort_order||j+1;
  try{
    await rpc('bb_admin_save_product',{p_token:ADMIN_TOKEN,p_id:p.id,p_category_id:p.category_id,p_name:p.name,p_price:Number(p.price),p_image_url:p.image_url||null,p_is_active:p.is_active,p_sort_order:b});
    await rpc('bb_admin_save_product',{p_token:ADMIN_TOKEN,p_id:q.id,p_category_id:q.category_id,p_name:q.name,p_price:Number(q.price),p_image_url:q.image_url||null,p_is_active:q.is_active,p_sort_order:a});
    await loadAdminCatalog();
  }catch(e){alert('เรียงลำดับไม่สำเร็จ')}
}
ensureLogin();
